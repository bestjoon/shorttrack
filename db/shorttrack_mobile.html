<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⛸ 쇼트트랙 기록 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ── 리셋 & 변수 ── */
:root {
  --bg:        #0d1117;
  --bg2:       #161b27;
  --card:      #1c2333;
  --card2:     #222d3f;
  --glass:     rgba(255,255,255,0.04);
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.14);
  --cyan:      #22d3ee;
  --cyan-dim:  rgba(34,211,238,0.15);
  --blue:      #3b82f6;
  --blue-dim:  rgba(59,130,246,0.18);
  --indigo:    #6366f1;
  --text:      #f1f5f9;
  --text2:     #94a3b8;
  --text3:     #64748b;
  --gold:      #fbbf24;
  --silver:    #cbd5e1;
  --bronze:    #fb923c;
  --red:       #f87171;
  --green:     #34d399;
  --purple:    #a78bfa;
  --radius:    16px;
  --radius-sm: 10px;
  --shadow:    0 4px 24px rgba(0,0,0,0.35);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
  --glow-cyan: 0 0 20px rgba(34,211,238,0.25);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { font-size:15px; }
body {
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overscroll-behavior:none;
}

/* ── 헤더 ── */
.app-header {
  background:linear-gradient(135deg,#0a0f1e 0%,#0d1a3a 100%);
  padding:14px 16px 12px;
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:200;
  border-bottom:1px solid rgba(34,211,238,0.18);
  box-shadow:0 4px 32px rgba(0,0,0,0.6),0 1px 0 rgba(34,211,238,0.12);
}
.header-left { display:flex; align-items:center; gap:11px; }
.header-icon {
  font-size:1.6rem;
  filter:drop-shadow(0 0 10px rgba(34,211,238,0.8));
  animation:sway 3s ease-in-out infinite;
}
@keyframes sway { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
.header-title {
  color:#fff; font-weight:900; font-size:1rem; letter-spacing:-0.3px;
}
.header-sub { color:rgba(255,255,255,0.4); font-size:0.65rem; margin-top:2px; font-family:'Rajdhani',sans-serif; letter-spacing:0.5px; }
.btn-upload {
  background:rgba(34,211,238,0.1);
  border:1px solid rgba(34,211,238,0.3);
  color:var(--cyan); border-radius:20px; padding:7px 14px;
  font-size:0.75rem; font-family:inherit; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  transition:all 0.2s; white-space:nowrap; font-weight:700;
}
.btn-upload:active { background:rgba(34,211,238,0.22); }
#fileInput { display:none; }

/* ── 하단 탭바 ── */
.tab-bar {
  position:fixed; bottom:0; left:0; right:0;
  background:#0a0f1e;
  border-top:1px solid rgba(34,211,238,0.15);
  display:flex; z-index:200;
  box-shadow:0 -8px 32px rgba(0,0,0,0.6);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-item {
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:10px 6px 9px; border:none; background:none;
  cursor:pointer; font-family:inherit; color:var(--text3);
  transition:all 0.2s; gap:3px; position:relative;
}
.tab-item::after {
  content:''; position:absolute; bottom:0; left:25%; right:25%;
  height:2px; background:var(--cyan); border-radius:2px 2px 0 0;
  opacity:0; transition:opacity 0.2s;
}
.tab-item.active { color:var(--cyan); }
.tab-item.active::after { opacity:1; }
.tab-icon { font-size:1.25rem; }
.tab-label { font-size:0.65rem; font-weight:700; letter-spacing:0.5px; }

/* ── 레이아웃 ── */
.page-wrap { padding:12px 12px calc(72px + env(safe-area-inset-bottom)) 12px; }
.page { display:none; animation:fadeUp 0.25s ease; }
.page.active { display:block; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

/* ── 데이터 배너 ── */
.data-banner {
  background:var(--card); border-radius:var(--radius-sm);
  padding:10px 14px; display:flex; align-items:center; gap:9px;
  font-size:0.73rem; color:var(--text2); margin-bottom:10px;
  border:1px solid var(--border); box-shadow:var(--shadow);
}
.banner-dot { width:7px;height:7px;border-radius:50%;background:var(--text3);flex-shrink:0; }
.banner-dot.ok { background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite; }
.banner-dot.err { background:var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── 필터 패널 ── */
.filter-panel {
  background:var(--card);
  border-radius:var(--radius); margin-bottom:12px; overflow:hidden;
  border:1px solid var(--border); box-shadow:var(--shadow);
}
.filter-toggle {
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px; background:none; border:none; cursor:pointer;
  font-family:inherit; font-size:0.85rem; font-weight:700; color:var(--text2);
  transition:background 0.15s;
}
.filter-toggle:active { background:var(--glass); }
.filter-toggle-left { display:flex; align-items:center; gap:8px; }
.filter-toggle-right { display:flex; align-items:center; gap:8px; }
.filter-badge {
  background:var(--cyan); color:#0a0f1e; border-radius:10px;
  padding:1px 8px; font-size:0.68rem; font-weight:900; display:none;
}
.filter-badge.show { display:inline-block; }
.chevron { font-size:0.72rem; color:var(--text3); transition:transform 0.25s; }
.filter-panel.open .chevron { transform:rotate(180deg); }
.filter-body {
  display:none; padding:4px 16px 16px;
  border-top:1px solid var(--border);
  background:var(--card2);
}
.filter-panel.open .filter-body { display:block; }

/* 필터 섹션 */
.filter-section { margin-top:13px; }
.filter-label {
  font-size:0.67rem; font-weight:700; color:var(--text3);
  text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px;
  font-family:'Rajdhani',sans-serif;
}

/* 칩 버튼 */
.chip-group { display:flex; flex-wrap:wrap; gap:6px; }
.chip-btn {
  padding:6px 14px; border-radius:20px;
  border:1px solid var(--border2);
  background:rgba(255,255,255,0.04);
  color:var(--text2); font-size:0.78rem; font-weight:600;
  font-family:inherit; cursor:pointer; transition:all 0.15s;
  user-select:none; -webkit-user-select:none;
}
.chip-btn.selected {
  background:var(--cyan); border-color:var(--cyan);
  color:#0a0f1e; font-weight:900;
  box-shadow:0 0 12px rgba(34,211,238,0.35);
}
.chip-btn:active { transform:scale(0.94); }

/* 텍스트 검색 */
.search-input-wrap { position:relative; margin-top:0; }
.search-input {
  width:100%; padding:10px 36px 10px 38px;
  border:1px solid var(--border2); border-radius:var(--radius-sm);
  font-size:0.88rem; font-family:inherit;
  background:rgba(255,255,255,0.05); color:var(--text); outline:none;
  transition:border-color 0.2s,box-shadow 0.2s;
}
.search-input::placeholder { color:var(--text3); }
.search-input:focus {
  border-color:var(--cyan); background:rgba(34,211,238,0.06);
  box-shadow:0 0 0 3px rgba(34,211,238,0.12);
}
.search-icon {
  position:absolute; left:11px; top:50%; transform:translateY(-50%);
  color:var(--text3); font-size:1rem; pointer-events:none;
}
.btn-clear-text {
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--text3); font-size:0.9rem;
  cursor:pointer; padding:3px; display:none;
}
.search-input:not(:placeholder-shown) ~ .btn-clear-text { display:block; }

/* 필터 액션 */
.filter-actions { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }
.btn-reset {
  padding:8px 16px; border:1px solid var(--border2); border-radius:var(--radius-sm);
  background:transparent; color:var(--text2); font-size:0.8rem; font-family:inherit; cursor:pointer;
  transition:all 0.15s;
}
.btn-reset:active { background:var(--glass); }
.btn-search {
  padding:8px 20px; background:var(--cyan); border:none; border-radius:var(--radius-sm);
  color:#0a0f1e; font-size:0.82rem; font-weight:900; font-family:inherit; cursor:pointer;
  box-shadow:0 0 16px rgba(34,211,238,0.3); display:flex; align-items:center; gap:5px;
  transition:all 0.15s;
}
.btn-search:active { opacity:0.8; transform:scale(0.97); }

/* 결과 요약 */
.result-meta {
  font-size:0.73rem; color:var(--text3); padding:4px 2px 8px;
  display:flex; align-items:center; gap:5px;
}
.result-meta b { color:var(--cyan); font-size:0.85rem; }

/* ── 선수 카드 목록 ── */
.player-list { display:flex; flex-direction:column; gap:8px; }
.player-card {
  background:var(--card); border-radius:var(--radius);
  padding:14px 15px; display:flex; align-items:center; gap:13px;
  box-shadow:var(--shadow); border:1px solid var(--border);
  cursor:pointer; transition:all 0.18s; -webkit-user-select:none;
  position:relative; overflow:hidden;
}
.player-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--cyan),var(--blue));
  opacity:0; transition:opacity 0.2s;
  border-radius:2px 0 0 2px;
}
.player-card:active { background:var(--card2); transform:scale(0.985); }
.player-card:active::before { opacity:1; }
.player-avatar {
  width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; font-size:1.1rem; flex-shrink:0;
  font-family:'Rajdhani',sans-serif;
}
.avatar-m {
  background:linear-gradient(135deg,#1e3a5f,#1e40af);
  color:#93c5fd; border:1.5px solid rgba(147,197,253,0.3);
  box-shadow:0 0 12px rgba(59,130,246,0.25);
}
.avatar-f {
  background:linear-gradient(135deg,#5b1a3a,#9d174d);
  color:#f9a8d4; border:1.5px solid rgba(249,168,212,0.3);
  box-shadow:0 0 12px rgba(236,72,153,0.2);
}
.player-info { flex:1; min-width:0; }
.player-name { font-weight:900; font-size:1rem; letter-spacing:-0.3px; color:var(--text); }
.player-meta { font-size:0.72rem; color:var(--text3); margin-top:2px; }
.player-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:6px; }
.tag { padding:2px 8px; border-radius:8px; font-size:0.65rem; font-weight:700; }
.tag-kind { background:rgba(59,130,246,0.15); color:#7dd3fc; border:1px solid rgba(59,130,246,0.2); }
.tag-sido { background:rgba(52,211,153,0.12); color:#6ee7b7; border:1px solid rgba(52,211,153,0.2); }
.tag-year { background:rgba(251,191,36,0.12); color:#fde68a; border:1px solid rgba(251,191,36,0.2); }
.player-arrow { color:var(--text3); font-size:1rem; }

/* 빈 상태 */
.empty { text-align:center; padding:56px 20px; color:var(--text3); }
.empty-icon { font-size:2.8rem; margin-bottom:12px; opacity:0.4; }
.empty p { font-size:0.88rem; }
.empty .empty-sub { font-size:0.74rem; margin-top:5px; }

/* ── 선수 상세 슬라이드 패널 ── */
.detail-overlay {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
  z-index:500; opacity:0; pointer-events:none; transition:opacity 0.3s;
}
.detail-overlay.open { opacity:1; pointer-events:auto; }
.detail-panel {
  position:fixed; bottom:0; left:0; right:0; top:52px;
  background:var(--bg2); border-radius:20px 20px 0 0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  z-index:501; transform:translateY(100%);
  transition:transform 0.38s cubic-bezier(0.32,0.72,0,1);
  overscroll-behavior:contain;
}
.detail-panel.open { transform:translateY(0); }
.detail-header {
  background:linear-gradient(160deg,#0a0f1e 0%,#0d1a3a 60%,#0f2040 100%);
  padding:16px 16px 18px;
  position:sticky; top:0; z-index:10;
  border-bottom:1px solid rgba(34,211,238,0.15);
}
.detail-header-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.btn-back {
  background:rgba(34,211,238,0.12); border:1px solid rgba(34,211,238,0.25);
  color:var(--cyan); border-radius:50%;
  width:34px; height:34px; font-size:1.1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.15s;
}
.btn-back:active { background:rgba(34,211,238,0.25); }
.detail-player-name {
  color:#fff; font-size:1.6rem; font-weight:900; letter-spacing:-0.5px;
  text-shadow:0 0 20px rgba(34,211,238,0.4);
}
.detail-chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.dchip { padding:3px 11px; border-radius:12px; font-size:0.72rem; font-weight:700; }
.dchip-m   { background:rgba(147,197,253,0.15); color:#93c5fd; border:1px solid rgba(147,197,253,0.25); }
.dchip-f   { background:rgba(249,168,212,0.15); color:#f9a8d4; border:1px solid rgba(249,168,212,0.25); }
.dchip-w   { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.7); border:1px solid rgba(255,255,255,0.12); }

.detail-body { padding:14px 12px; }

/* 정보 카드 */
.info-card {
  background:var(--card); border-radius:var(--radius);
  padding:15px; box-shadow:var(--shadow); border:1px solid var(--border);
  margin-bottom:10px;
}
.section-title {
  font-size:0.68rem; font-weight:700; text-transform:uppercase;
  letter-spacing:1px; color:var(--cyan); margin-bottom:11px;
  display:flex; align-items:center; gap:6px;
  font-family:'Rajdhani',sans-serif;
}
.info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.info-item {
  background:var(--card2); border-radius:var(--radius-sm);
  padding:10px 12px; border:1px solid var(--border);
}
.info-item-label {
  font-size:0.63rem; color:var(--text3); font-weight:700;
  text-transform:uppercase; letter-spacing:0.5px;
  font-family:'Rajdhani',sans-serif;
}
.info-item-val { font-size:0.9rem; font-weight:700; margin-top:3px; color:var(--text); }

/* 메달 */
.medal-row { display:flex; gap:8px; }
.medal-box {
  flex:1; background:var(--card2); border-radius:var(--radius-sm);
  padding:12px 8px; text-align:center; border:1px solid var(--border);
  transition:transform 0.15s;
}
.medal-box:active { transform:scale(0.95); }
.medal-icon { font-size:1.5rem; }
.medal-count { font-size:1.4rem; font-weight:900; margin-top:2px; font-variant-numeric:tabular-nums; }
.medal-gold   .medal-count { color:var(--gold); text-shadow:0 0 12px rgba(251,191,36,0.4); }
.medal-silver .medal-count { color:var(--silver); }
.medal-bronze .medal-count { color:var(--bronze); }
.medal-label { font-size:0.62rem; color:var(--text3); font-weight:700; margin-top:2px; font-family:'Rajdhani',sans-serif; letter-spacing:0.5px; }

/* 최고기록 / 메달 집계 테이블 */
.best-table { width:100%; border-collapse:collapse; font-size:0.78rem; }
.best-table th {
  background:var(--card2); color:var(--text3);
  font-size:0.63rem; font-weight:700; text-transform:uppercase;
  letter-spacing:0.5px; padding:8px 9px; text-align:left;
  border-bottom:1px solid var(--border);
  font-family:'Rajdhani',sans-serif;
}
.best-table td {
  padding:8px 9px; border-bottom:1px solid var(--border);
  vertical-align:middle; color:var(--text);
}
.best-table tr:last-child td { border-bottom:none; }
.best-table td.record-val {
  font-weight:900; color:var(--cyan); font-variant-numeric:tabular-nums;
  font-family:'Rajdhani',sans-serif; font-size:0.95rem;
}
.best-table tr:hover td { background:rgba(255,255,255,0.03); }

/* 대회기록 테이블 */
.comp-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.comp-table {
  width:100%; border-collapse:collapse; font-size:0.77rem; min-width:480px;
}
.comp-table th {
  background:var(--card2); color:var(--text3);
  font-size:0.62rem; font-weight:700; text-transform:uppercase;
  letter-spacing:0.4px; padding:9px 9px; text-align:left;
  border-bottom:1.5px solid var(--border); white-space:nowrap;
  font-family:'Rajdhani',sans-serif;
}
.comp-table td {
  padding:8px 9px; border-bottom:1px solid var(--border);
  vertical-align:middle; white-space:nowrap; color:var(--text);
}
.comp-table tr:last-child td { border-bottom:none; }
.comp-table tr:hover td { background:rgba(255,255,255,0.02); }
.comp-table .td-merge { color:var(--text3); font-style:italic; font-size:0.68rem; }
.comp-table td.record-val {
  font-weight:900; color:var(--cyan); font-family:'Rajdhani',sans-serif; font-size:0.9rem;
}
.comp-table td.rank-cell { text-align:center; }

/* 순위 뱃지 */
.rank-badge-sm {
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; border-radius:50%;
  font-size:0.72rem; font-weight:900;
}
.rank-1 { background:var(--gold); color:#3b1c00; }
.rank-2 { background:var(--silver); color:#1e293b; }
.rank-3 { background:var(--bronze); color:#fff; }
.rank-n { background:rgba(255,255,255,0.08); color:var(--text2); }

/* 라운드 태그 */
.round-tag {
  display:inline-block; padding:2px 8px; border-radius:6px;
  font-size:0.68rem; font-weight:700; font-family:'Rajdhani',sans-serif; letter-spacing:0.3px;
}
.round-final   { background:rgba(248,113,113,0.18); color:#fca5a5; border:1px solid rgba(248,113,113,0.25); }
.round-final-b { background:rgba(167,139,250,0.15); color:var(--purple); border:1px dashed rgba(167,139,250,0.4); }
.round-semi    { background:rgba(251,191,36,0.14); color:#fde68a; border:1px solid rgba(251,191,36,0.2); }
.round-qsemi   { background:rgba(251,146,60,0.12); color:#fdba74; border:1px solid rgba(251,146,60,0.18); }
.round-prelim  { background:rgba(56,189,248,0.12); color:#7dd3fc; border:1px solid rgba(56,189,248,0.18); }
.round-heat    { background:rgba(255,255,255,0.05); color:var(--text3); border:1px solid var(--border); }

/* 대회결과 테이블 */
.result-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.result-table {
  width:100%; border-collapse:collapse; font-size:0.78rem; min-width:500px;
}
.result-table th {
  background:var(--card2); color:var(--text3);
  font-size:0.62rem; font-weight:700; text-transform:uppercase;
  letter-spacing:0.4px; padding:9px 10px; text-align:left;
  border-bottom:1.5px solid var(--border); white-space:nowrap;
  font-family:'Rajdhani',sans-serif;
}
.result-table td {
  padding:8px 10px; border-bottom:1px solid var(--border);
  vertical-align:middle; white-space:nowrap; color:var(--text);
}
.result-table tr:last-child td { border-bottom:none; }
.result-table tr:hover td { background:rgba(255,255,255,0.02); }
.result-table td.record-val {
  font-weight:900; color:var(--cyan); font-family:'Rajdhani',sans-serif; font-size:0.9rem;
}
.result-comp-header td {
  background:linear-gradient(90deg,rgba(34,211,238,0.1) 0%,transparent 100%);
  font-weight:700; color:var(--cyan); font-size:0.78rem;
  padding:10px 10px; border-bottom:1px solid rgba(34,211,238,0.15);
  border-left:3px solid var(--cyan);
}
.result-kind-header td {
  background:rgba(59,130,246,0.06);
  font-weight:700; color:#93c5fd; font-size:0.72rem;
  padding:7px 10px; border-bottom:1px solid var(--border); padding-left:18px;
  border-left:3px solid rgba(59,130,246,0.4);
}
.result-event-header td {
  background:var(--card2); font-weight:600; color:var(--text2);
  font-size:0.7rem; padding:6px 10px; border-bottom:1px solid var(--border);

}

/* 로딩 화면 */
.loading-screen {
  position:fixed; inset:0; background:#0a0f1e;
  z-index:1000; display:flex; flex-direction:column;

<script>
'use strict';
/* ══════════════════════════════════════════════
   전역 상태
══════════════════════════════════════════════ */
const DB = { players: [], history: [] };
let playerMap = {};
let playerHistoryMap = {};
let currentPlayers = [];
let currentResultRows = [];

/* ══════════════════════════════════════════════
   라운드 순서 정의
══════════════════════════════════════════════ */
const ROUND_ORDER = ['결승','준결승','준준결승','예선','예비예선'];

function getRoundLevel(rn) {
  if (!rn) return 99;
  const r = rn.replace(/\s/g,'');
  if (/^결승/.test(r)) return 0;
  if (/^준결승/.test(r)) return 1;
  if (/^준준결승/.test(r)) return 2;
  if (/^예선/.test(r)) return 3;
  if (/^예비예선/.test(r)) return 4;
  return 5;
}

function getRoundClass(rn) {
  if (!rn) return 'round-heat';
  const r = rn.replace(/\s/g,'');
  if (r === '결승B') return 'round-final-b';   // 결승B 전용
  const lvl = getRoundLevel(rn);
  if (lvl===0) return 'round-final';
  if (lvl===1) return 'round-semi';
  if (lvl===2) return 'round-qsemi';
  if (lvl===3) return 'round-prelim';
  return 'round-heat';
}

function getRoundShort(rn) {
  if (!rn) return '';
  // 결승B는 그대로 표시
  if (rn.replace(/\s/g,'') === '결승B') return '결승B';
  // 준결승1조Semi Final 1 → 준결승1조
  return rn.replace(/[A-Za-z\s]+\d*$/,'').trim() || rn;
}

/* ══════════════════════════════════════════════
   날짜 파싱 / 포맷
══════════════════════════════════════════════ */
function normDate(d) {
  if (!d) return '';
  d = String(d).trim();
  // 2024.10.31 → 20241031
  if (/^\d{4}\.\d{2}\.\d{2}/.test(d)) return d.replace(/\./g,'').slice(0,8);
  // 2024-10-31 → 20241031
  if (/^\d{4}-\d{2}-\d{2}/.test(d)) return d.replace(/-/g,'').slice(0,8);
  return d.slice(0,8);
}

function fmtDate(d) {
  const s = normDate(d);
  if (s.length===8) return `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}`;
  return d || '';
}

/* ══════════════════════════════════════════════
   기록 파싱 (초)
══════════════════════════════════════════════ */
function parseTime(s) {
  if (!s) return null;
  s = s.trim();
  const m = s.match(/^(\d+):(\d+)\.(\d+)$/);
  if (m) {
    const frac = parseInt(m[3]) / Math.pow(10, m[3].length);
    return parseInt(m[1]) * 60 + parseInt(m[2]) + frac;
  }
  const m2 = s.match(/^(\d+)\.(\d+)$/);
  if (m2) return parseInt(m2[1]) + parseInt(m2[2]) / Math.pow(10, m2[2].length);
  return null;
}

/* ══════════════════════════════════════════════
   메달 판정
══════════════════════════════════════════════ */
function isMedalRound(rn) {
  if (!rn) return false;
  // 결승Final, 결승(오픈), 결승1조, 결승2조, 결승B 제외하고 결승으로 시작하는 것
  // 결승A는 메달, 결승B는 메달 아님(문제에서 결승 또는 결승A)
  const r = rn.replace(/\s/g,'');
  if (r === '결승B') return false;
  return /^결승/.test(r);
}

/* ══════════════════════════════════════════════
   데이터 초기화
══════════════════════════════════════════════ */
function initData(data, filename) {
  setLoading(60, '선수 데이터 구성 중...');
  DB.players = data.players || [];
  DB.history = data.history || data.records || [];

  playerMap = {};
  DB.players.forEach(p => { playerMap[p.player_id] = p; });

  setLoading(80, '기록 인덱싱 중...');
  playerHistoryMap = {};
  DB.history.forEach(h => {
    const p = playerMap[h.player_id];
    h._playerName = p ? p.name : (h.player_name || '');
    h._dateNorm = normDate(h.event_date);
    if (!playerHistoryMap[h.player_id]) playerHistoryMap[h.player_id] = [];
    playerHistoryMap[h.player_id].push(h);
  });

  setLoading(90, 'UI 구성 중...');
  buildBirthYearChips();
  initResultSelects();

  const info = `선수 ${DB.players.length.toLocaleString()}명 · 기록 ${DB.history.length.toLocaleString()}건${filename?' · '+filename:''}`;
  document.getElementById('headerSub').textContent = info;
  document.getElementById('bannerText').textContent = info;
  document.getElementById('bannerDot').className = 'banner-dot ok';

  setLoading(100, '완료');
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hidden');
    runPlayerSearch();
  }, 300);
}

/* ══════════════════════════════════════════════
   자동 로드
══════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  setLoading(20, 'shorttrack_data.json 로딩 중...');
  try {
    const res = await fetch('shorttrack_data.json');
    if (!res.ok) throw new Error('fetch failed');
    setLoading(40, 'JSON 파싱 중...');
    const data = await res.json();
    initData(data, 'shorttrack_data.json');
  } catch(e) {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('bannerText').textContent = '자동 로드 실패 — 📂 파일 교체 버튼으로 JSON 파일을 선택하세요';
    document.getElementById('bannerDot').className = 'banner-dot err';
    console.warn('Auto-load failed:', e.message);
  }
});

document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  document.getElementById('loadingScreen').classList.remove('hidden');
  setLoading(20, '파일 읽는 중...');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      setLoading(50, 'JSON 파싱 중...');
      const data = JSON.parse(e.target.result);
      initData(data, file.name);
    } catch(err) {
      document.getElementById('loadingScreen').classList.add('hidden');
      alert('파일 파싱 오류: ' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  this.value = '';
});

function setLoading(pct, msg) {
  document.getElementById('loadingBar').style.width = pct + '%';
  document.getElementById('loadingMsg').textContent = msg;
}

/* ══════════════════════════════════════════════
   칩 빌더
══════════════════════════════════════════════ */
const BIRTH_YEAR_CUTOFF = 2008;

function buildBirthYearChips() {
  const allYears = [...new Set(DB.players.map(p=>p.birth_year).filter(Boolean))].sort((a,b)=>a-b);
  const hasOld = allYears.some(y => parseInt(y) < BIRTH_YEAR_CUTOFF);
  const recentYears = allYears.filter(y => parseInt(y) >= BIRTH_YEAR_CUTOFF);

  const container = document.getElementById('birthYearChips');
  let html = '';
  if (hasOld) {
    html += `<button class="chip-btn" data-val="__before${BIRTH_YEAR_CUTOFF}__">${BIRTH_YEAR_CUTOFF-1}년 이전</button>`;
  }
  html += recentYears.map(y => `<button class="chip-btn" data-val="${y}">${y}</button>`).join('');
  container.innerHTML = html;

  container.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.toggle('selected');
      runPlayerSearch();
    });
  });
}

function getSelectedChips(containerId) {
  return [...document.querySelectorAll(`#${containerId} .chip-btn.selected`)].map(b => b.dataset.val);
}

function clearChips(containerId) {
  document.querySelectorAll(`#${containerId} .chip-btn`).forEach(b => b.classList.remove('selected'));
}

/* ══════════════════════════════════════════════
   필터 패널 토글
══════════════════════════════════════════════ */
function setupFilterPanel(panelId, toggleId) {
  const panel = document.getElementById(panelId);
  document.getElementById(toggleId).addEventListener('click', () => {
    panel.classList.toggle('open');
  });
}
setupFilterPanel('playerFilterPanel','playerFilterToggle');
setupFilterPanel('resultFilterPanel','resultFilterToggle');

// 성별 칩 클릭 → 즉시 검색
document.querySelectorAll('#genderChips .chip-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    btn.classList.toggle('selected');
    runPlayerSearch();
  });
});

/* ══════════════════════════════════════════════
   탭 전환
══════════════════════════════════════════════ */
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
  });
});

/* ══════════════════════════════════════════════
   선수 조회
══════════════════════════════════════════════ */
document.getElementById('playerSearchBtn').addEventListener('click', () => runPlayerSearch());
document.getElementById('playerNameInput').addEventListener('input', debounce(() => runPlayerSearch(), 300));
document.getElementById('playerNameInput').addEventListener('keydown', e => { if(e.key==='Enter') runPlayerSearch(); });
document.getElementById('playerResetBtn').addEventListener('click', () => {
  clearChips('genderChips');
  clearChips('birthYearChips');
  document.getElementById('playerNameInput').value = '';
  updatePlayerBadge();
  runPlayerSearch();
});

function updatePlayerBadge() {
  const cnt = getSelectedChips('genderChips').length + getSelectedChips('birthYearChips').length +
    (document.getElementById('playerNameInput').value.trim() ? 1 : 0);
  const badge = document.getElementById('playerFilterBadge');
  badge.textContent = cnt;
  badge.classList.toggle('show', cnt > 0);
}

function runPlayerSearch() {
  updatePlayerBadge();
  const genders = getSelectedChips('genderChips');
  const years   = getSelectedChips('birthYearChips');
  const name    = document.getElementById('playerNameInput').value.trim();

  // 출생년도 필터: "__before2007__" 칩은 BIRTH_YEAR_CUTOFF 미만 전체로 매칭
  const wantOld = years.includes(`__before${BIRTH_YEAR_CUTOFF}__`);
  const exactYears = years.filter(y => !y.startsWith('__'));

  currentPlayers = DB.players.filter(p => {
    if (genders.length && !genders.includes(p.gender)) return false;
    if (years.length) {
      const by = parseInt(p.birth_year||0);
      const matchOld   = wantOld && by < BIRTH_YEAR_CUTOFF;
      const matchExact = exactYears.includes(p.birth_year);
      if (!matchOld && !matchExact) return false;
    }
    if (name && !p.name.includes(name)) return false;
    return true;
  }).sort((a,b) => {
    const na = parseInt(a.birth_year||0), nb = parseInt(b.birth_year||0);
    return na - nb || a.name.localeCompare(b.name, 'ko');
  });

  document.getElementById('playerResultMeta').innerHTML =
    `<b>${currentPlayers.length.toLocaleString()}</b> 명의 선수`;

  const list = document.getElementById('playerList');
  if (!currentPlayers.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>검색 결과가 없습니다</p><p class="empty-sub">조건을 변경해 보세요</p></div>`;
    return;
  }
  list.innerHTML = currentPlayers.map(p => {
    const initial = p.name.slice(0,1);
    const histCnt = (playerHistoryMap[p.player_id]||[]).length;
    return `<div class="player-card" onclick="openPlayerDetail('${p.player_id}')">
      <div class="player-avatar ${p.gender==='남'?'avatar-m':'avatar-f'}">${initial}</div>
      <div class="player-info">
        <div class="player-name">${p.name}</div>
        <div class="player-meta">${p.team_nm||''} · ${p.birth_year||''}년생 · 기록 ${histCnt}건</div>
        <div class="player-tags">
          <span class="tag tag-kind">${p.kind_nm||''}</span>
          <span class="tag tag-sido">${p.sido||''}</span>
          ${p.birth_year?`<span class="tag tag-year">${p.birth_year}</span>`:''}
        </div>
      </div>
      <div class="player-arrow">›</div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════════
   선수 상세
══════════════════════════════════════════════ */
function openPlayerDetail(pid) {
  const p = playerMap[pid];
  if (!p) return;

  const hist = (playerHistoryMap[pid]||[]).slice();

  // ── 기본 정보
  document.getElementById('dpName').textContent = p.name;
  document.getElementById('dpChips').innerHTML = `
    <span class="dchip ${p.gender==='남'?'dchip-m':'dchip-f'}">${p.gender==='남'?'♂ 남자':'♀ 여자'}</span>
    <span class="dchip dchip-w">${p.kind_nm||''}</span>
    <span class="dchip dchip-w">${p.sido||''}</span>
    <span class="dchip dchip-w">${p.birth_year||''}년생</span>
  `;

  // ── 메달 집계 (결승 라운드, 결승B 제외) — 연도별
  const medalByYear = {}; // year → { gold, silver, bronze }
  hist.forEach(h => {
    if (!isMedalRound(h.round_nm)) return;
    const r = parseInt(h.rank);
    if (r !== 1 && r !== 2 && r !== 3) return;
    const yr = (h._dateNorm || '').slice(0, 4) || '?';
    if (!medalByYear[yr]) medalByYear[yr] = { gold:0, silver:0, bronze:0 };
    if (r===1) medalByYear[yr].gold++;
    else if (r===2) medalByYear[yr].silver++;
    else medalByYear[yr].bronze++;
  });
  const medalYears = Object.keys(medalByYear).sort();
  const medalTotal = medalYears.reduce(
    (acc, yr) => {
      acc.gold   += medalByYear[yr].gold;
      acc.silver += medalByYear[yr].silver;
      acc.bronze += medalByYear[yr].bronze;
      return acc;
    }, { gold:0, silver:0, bronze:0 }
  );

  // ── 연도별 500M 최고기록
  const best500Map = {}; // yyyy → {record, time, comp, round}
  hist.forEach(h => {
    if ((h.event_nm||'').trim() !== '500M') return;
    if (!h.record) return;
    const t = parseTime(h.record);
    if (t === null) return;
    const yr = (h._dateNorm||'').slice(0,4) || '?';
    if (!best500Map[yr] || t < best500Map[yr].time) {
      best500Map[yr] = { year:yr, record:h.record, time:t, comp:h.competition_nm, round:h.round_nm };
    }
  });
  const best500List = Object.values(best500Map).sort((a,b)=>(a.year||'').localeCompare(b.year||''));

  // ── 대회기록 정렬 (날짜 내림차순, 같은 날짜면 라운드 순서)
  // 채점종합: 날짜가 없더라도 같은 대회의 가장 늦은 날짜를 빌려 쓰고, 라운드 레벨을 맨 마지막으로
  const compMaxDate = {};
  hist.forEach(h => {
    const d = h._dateNorm||'';
    if (!d) return;
    const c = h.competition_nm||'';
    if (!compMaxDate[c] || d > compMaxDate[c]) compMaxDate[c] = d;
  });

  function sortKey(h) {
    const isChaejom = (h.round_nm||'').trim() === '채점종합';
    const date = h._dateNorm || compMaxDate[h.competition_nm||''] || '';
    const roundLvl = isChaejom ? 999 : getRoundLevel(h.round_nm);
    return { date, roundLvl };
  }

  const sortedHist = hist.slice().sort((a,b) => {
    const ka = sortKey(a), kb = sortKey(b);
    const dd = kb.date.localeCompare(ka.date);   // 날짜 내림차순
    if (dd!==0) return dd;
    const cc = (a.competition_nm||'').localeCompare(b.competition_nm||'');
    if (cc!==0) return cc;
    return ka.roundLvl - kb.roundLvl;            // 라운드 순서 (채점종합=999 → 맨 뒤)
  });

  // ── HTML 빌드
  let html = '';

  // 기본정보
  html += `<div class="info-card">
    <div class="section-title">👤 기본 정보</div>
    <div class="info-grid">
      <div class="info-item"><div class="info-item-label">소속팀</div><div class="info-item-val">${p.team_nm||'–'}</div></div>
      <div class="info-item"><div class="info-item-label">등록구분</div><div class="info-item-val">${p.reg_type||'–'}</div></div>
      <div class="info-item"><div class="info-item-label">최종등록</div><div class="info-item-val">${p.last_reg_year||'–'}년</div></div>
      <div class="info-item"><div class="info-item-label">선수 ID</div><div class="info-item-val" style="font-size:0.72rem;word-break:break-all">${p.player_id}</div></div>
    </div>
  </div>`;

  // 메달 — 연도별 집계
  if (medalYears.length) {
    let medalHtml = `<div class="info-card">
      <div class="section-title">🏅 메달 현황 <span style="font-size:0.65rem;font-weight:400;color:var(--muted)">(결승 1·2·3위 · 연도별)</span></div>
      <table class="best-table">
        <thead>
          <tr>
            <th>연도</th>
            <th style="text-align:center">🥇</th>
            <th style="text-align:center">🥈</th>
            <th style="text-align:center">🥉</th>
            <th style="text-align:center">합계</th>
          </tr>
        </thead>
        <tbody>`;
    medalYears.forEach(yr => {
      const m = medalByYear[yr];
      const total = m.gold + m.silver + m.bronze;
      medalHtml += `<tr>
        <td><b>${yr}</b></td>
        <td style="text-align:center;font-weight:700;color:var(--gold)">${m.gold||'–'}</td>
        <td style="text-align:center;font-weight:700;color:var(--silver)">${m.silver||'–'}</td>
        <td style="text-align:center;font-weight:700;color:var(--bronze)">${m.bronze||'–'}</td>
        <td style="text-align:center;font-weight:700;color:var(--text2)">${total}</td>
      </tr>`;
    });
    // 합계 행 (2년 이상일 때만)
    if (medalYears.length > 1) {
      const tot = medalTotal.gold + medalTotal.silver + medalTotal.bronze;
      medalHtml += `<tr style="border-top:2px solid var(--border2);background:var(--surface2)">
        <td><b>합계</b></td>
        <td style="text-align:center;font-weight:900;color:var(--gold)">${medalTotal.gold||'–'}</td>
        <td style="text-align:center;font-weight:900;color:var(--silver)">${medalTotal.silver||'–'}</td>
        <td style="text-align:center;font-weight:900;color:var(--bronze)">${medalTotal.bronze||'–'}</td>
        <td style="text-align:center;font-weight:900;color:var(--blue2)">${tot}</td>
      </tr>`;
    }
    medalHtml += `</tbody></table></div>`;
    html += medalHtml;
  }

  // 연도별 500M 최고기록
  if (best500List.length) {
    html += `<div class="info-card">
      <div class="section-title">⏱ 연도별 단거리 최고기록 <span style="font-size:0.65rem;font-weight:400;color:var(--muted)">(500M)</span></div>
      <table class="best-table">
        <thead><tr><th>연도</th><th>최고기록</th><th>대회</th></tr></thead>
        <tbody>`;
    best500List.forEach(b => {
      html += `<tr>
        <td><b>${b.year}</b></td>
        <td class="record-val">${b.record}</td>
        <td style="font-size:0.68rem;color:var(--text2);max-width:150px;overflow:hidden;text-overflow:ellipsis" title="${b.comp}">${b.comp}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  // 대회기록 (병합 표시)
  html += `<div class="info-card" style="padding:0;overflow:hidden">
    <div style="padding:14px 14px 10px;border-bottom:1px solid var(--border)">
      <div class="section-title" style="margin-bottom:0">📋 대회 출전 기록 <span style="color:var(--muted);font-weight:400">(${sortedHist.length}건)</span></div>
    </div>
    <div class="comp-table-wrap">
      <table class="comp-table">
        <thead><tr>
          <th>대회명</th><th>종별</th><th>종목</th><th>경기일자</th>
          <th>라운드</th><th>기록</th><th style="text-align:center">순위</th>
        </tr></thead>
        <tbody>`;

  let prevComp='', prevKind='', prevEvent='', prevDate='';
  sortedHist.forEach(h => {
    const comp  = h.competition_nm||'';
    const kind  = h.kind_nm||'';
    const event = h.event_nm||'';
    const date  = fmtDate(h.event_date);
    const isSameComp  = comp===prevComp;
    const isSameKind  = isSameComp && kind===prevKind;
    const isSameEvent = isSameKind && event===prevEvent;
    const isSameDate  = isSameComp && date===prevDate;

    const rankNum = parseInt(h.rank);
    let rankCell;
    if (rankNum===1) rankCell = `<span class="rank-badge-sm rank-1">1</span>`;
    else if (rankNum===2) rankCell = `<span class="rank-badge-sm rank-2">2</span>`;
    else if (rankNum===3) rankCell = `<span class="rank-badge-sm rank-3">3</span>`;
    else rankCell = h.rank ? `<span class="rank-badge-sm rank-n">${h.rank}</span>` : '–';

    const roundShort = getRoundShort(h.round_nm);
    const roundClass = getRoundClass(h.round_nm);

    html += `<tr>
      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis" title="${comp}">${isSameComp?'<span class="td-merge">↳</span>':comp}</td>
      <td>${isSameKind?'<span class="td-merge">″</span>':kind}</td>
      <td><b>${isSameEvent?'<span class="td-merge">″</span>':event}</b></td>
      <td>${isSameDate?'<span class="td-merge">″</span>':date}</td>
      <td><span class="round-tag ${roundClass}">${roundShort}</span></td>
      <td class="record-val">${h.record||'–'}</td>
      <td class="rank-cell">${rankCell}</td>
    </tr>`;

    prevComp=comp; prevKind=kind; prevEvent=event; prevDate=date;
  });

  html += `</tbody></table></div></div>`;

  document.getElementById('detailBody').innerHTML = html;

  // 패널 오픈
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('detailPanel').scrollTop = 0;
}

document.getElementById('detailOverlay').addEventListener('click', closeDetail);

  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
}

/* ══════════════════════════════════════════════
   대회 결과 조회 — 콤보박스 + 연동 필터
══════════════════════════════════════════════ */

// 대회 날짜 맵: competition_nm → 최초 등장 날짜(정렬용)
let compDateMap = {};

function initResultSelects() {
  // 대회명: 날짜 내림차순 정렬
  compDateMap = {};
  DB.history.forEach(h => {
    const nm = h.competition_nm||'';
    if (!nm) return;
    const d = h._dateNorm||'';
    if (!compDateMap[nm] || d > compDateMap[nm]) compDateMap[nm] = d;
  });
  const comps = Object.keys(compDateMap).sort((a,b)=>
    (compDateMap[b]||'').localeCompare(compDateMap[a]||'')
  );
  fillResultSelect('sel-comp', comps, '전체 대회');
  updateDependentSelects();
}

// sel-comp 변경 → 종별 갱신
// sel-kind 변경 → 종목 갱신
// sel-event 변경 → 라운드 갱신
// 각 단계에서 현재 선택값이 새 옵션 목록에 없으면 초기화

document.addEventListener('change', e => {
  const id = e.target.id;
  if (id === 'sel-comp') {
    updateDependentSelects('comp');
  } else if (id === 'sel-kind') {
    updateDependentSelects('kind');
  } else if (id === 'sel-event') {
    updateDependentSelects('event');
  }
  // 선택값 있으면 파란 강조
  ['sel-comp','sel-kind','sel-event','sel-round'].forEach(sid => {
    const el = document.getElementById(sid);
    if (el) el.classList.toggle('has-value', !!el.value);
  });
  updateResultBadge();
  runResultSearch();
});

function getFilteredHistoryFor(upTo) {
  // upTo: 'comp' | 'kind' | 'event' | null
  // 각 단계까지의 선택값으로 필터링한 history 반환
  const comp  = document.getElementById('sel-comp')?.value  || '';
  const kind  = upTo==='comp' ? '' : (document.getElementById('sel-kind')?.value  || '');
  const event = (upTo==='comp'||upTo==='kind') ? '' : (document.getElementById('sel-event')?.value || '');
  return DB.history.filter(h => {
    if (comp  && h.competition_nm !== comp)  return false;
    if (kind  && h.kind_nm        !== kind)  return false;
    if (event && h.event_nm       !== event) return false;
    return true;
  });
}

function updateDependentSelects(changedLevel) {
  // changedLevel: 'comp' | 'kind' | 'event' | undefined(초기)

  const selComp  = document.getElementById('sel-comp');
  const selKind  = document.getElementById('sel-kind');
  const selEvent = document.getElementById('sel-event');
  const selRound = document.getElementById('sel-round');

  // 종별 옵션: comp 선택 기준
  if (!changedLevel || changedLevel === 'comp') {
    const prevKind = selKind.value;
    const baseK = getFilteredHistoryFor('comp');
    const kinds = [...new Set(baseK.map(h=>h.kind_nm).filter(Boolean))].sort();
    fillResultSelect('sel-kind', kinds, '전체 종별');
    if (kinds.includes(prevKind)) selKind.value = prevKind;
    selKind.classList.toggle('has-value', !!selKind.value);
  }

  // 종목 옵션: comp + kind 기준
  if (!changedLevel || changedLevel === 'comp' || changedLevel === 'kind') {
    const prevEvent = selEvent.value;
    const baseE = getFilteredHistoryFor('kind');
    const events = [...new Set(baseE.map(h=>h.event_nm).filter(Boolean))].sort();
    fillResultSelect('sel-event', events, '전체 종목');
    if (events.includes(prevEvent)) selEvent.value = prevEvent;
    selEvent.classList.toggle('has-value', !!selEvent.value);
  }

  // 라운드 옵션: comp + kind + event 기준, 라운드 레벨 순 정렬
  {
    const prevRound = selRound.value;
    const baseR = getFilteredHistoryFor('event');
    const rounds = [...new Set(baseR.map(h=>h.round_nm).filter(Boolean))]
      .sort((a,b) => {
        const ld = getRoundLevel(a) - getRoundLevel(b);
        if (ld !== 0) return ld;
        return a.localeCompare(b, 'ko');
      });
    fillResultSelect('sel-round', rounds, '전체 라운드');
    if (rounds.includes(prevRound)) selRound.value = prevRound;
    selRound.classList.toggle('has-value', !!selRound.value);
  }
}

function fillResultSelect(id, options, placeholder) {
  const sel = document.getElementById(id);
  if (!sel) return;
  const prevVal = sel.value;
  // DOM API 사용으로 특수문자 안전 처리
  sel.innerHTML = '';
  const defOpt = document.createElement('option');
  defOpt.value = ''; defOpt.textContent = placeholder;
  sel.appendChild(defOpt);
  options.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    sel.appendChild(opt);
  });
  // 이전 값 복원
  if (options.includes(prevVal)) sel.value = prevVal;
  else sel.value = '';
  sel.classList.toggle('has-value', !!sel.value);
}

document.getElementById('resultSearchBtn').addEventListener('click', () => runResultSearch());
document.getElementById('resultNameInput').addEventListener('input', debounce(() => runResultSearch(), 300));
document.getElementById('resultNameInput').addEventListener('keydown', e => { if(e.key==='Enter') runResultSearch(); });

document.getElementById('resultResetBtn').addEventListener('click', () => {
  ['sel-comp','sel-kind','sel-event','sel-round'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.value = ''; el.classList.remove('has-value'); }
  });
  document.getElementById('resultNameInput').value = '';
  updateDependentSelects();
  updateResultBadge();
  renderResultTable([]);
  document.getElementById('resultMeta').innerHTML = '';
});

function updateResultBadge() {
  let cnt = 0;
  ['sel-comp','sel-kind','sel-event','sel-round'].forEach(id => {
    if (document.getElementById(id)?.value) cnt++;
  });
  if (document.getElementById('resultNameInput').value.trim()) cnt++;
  const badge = document.getElementById('resultFilterBadge');
  badge.textContent = cnt;
  badge.classList.toggle('show', cnt > 0);
}

function runResultSearch() {
  updateResultBadge();
  const comp  = document.getElementById('sel-comp').value;
  const kind  = document.getElementById('sel-kind').value;
  const event = document.getElementById('sel-event').value;
  const round = document.getElementById('sel-round').value;
  const name  = document.getElementById('resultNameInput').value.trim();

  let rows = DB.history.filter(h => {
    if (comp  && h.competition_nm !== comp)  return false;
    if (kind  && h.kind_nm        !== kind)  return false;
    if (event && h.event_nm       !== event) return false;
    if (round && h.round_nm       !== round) return false;
    if (name  && !h._playerName.includes(name)) return false;
    return true;
  });

  // 정렬: 경기일자 내림차순 → 대회 → 종별 → 종목 → 라운드 레벨 → 순위
  // 채점종합: 날짜 없어도 같은 대회의 최신 날짜를 빌려 쓰고, 라운드 레벨을 맨 마지막으로
  const compMaxDateR = {};
  rows.forEach(h => {
    const d = h._dateNorm||'';
    if (!d) return;
    const c = h.competition_nm||'';
    if (!compMaxDateR[c] || d > compMaxDateR[c]) compMaxDateR[c] = d;
  });
  rows.sort((a,b) => {
    const isChaejomA = (a.round_nm||'').trim() === '채점종합';
    const isChaejomB = (b.round_nm||'').trim() === '채점종합';
    const da = a._dateNorm || compMaxDateR[a.competition_nm||''] || '';
    const db = b._dateNorm || compMaxDateR[b.competition_nm||''] || '';
    const dd = db.localeCompare(da);
    if (dd!==0) return dd;
    const cc = (a.competition_nm||'').localeCompare(b.competition_nm||'');
    if (cc!==0) return cc;
    const kk = (a.kind_nm||'').localeCompare(b.kind_nm||'');
    if (kk!==0) return kk;
    const ee = (a.event_nm||'').localeCompare(b.event_nm||'');
    if (ee!==0) return ee;
    const ra = isChaejomA ? 999 : getRoundLevel(a.round_nm);
    const rb = isChaejomB ? 999 : getRoundLevel(b.round_nm);
    if (ra!==rb) return ra - rb;
    // 같은 라운드 내 상세 조 번호 자연 정렬
    const rna = a.round_nm||'', rnb = b.round_nm||'';
    if (rna!==rnb) return rna.localeCompare(rnb,'ko',{numeric:true});
    return parseInt(a.rank||99) - parseInt(b.rank||99);
  });

  currentResultRows = rows;
  document.getElementById('resultMeta').innerHTML = rows.length
    ? `<b>${rows.length.toLocaleString()}</b> 건의 기록`
    : '';
  renderResultTable(rows);
}

function renderResultTable(rows) {
  const tbody = document.getElementById('resultTableBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">🏆</div><p>조건을 설정하고 조회하세요</p></div></td></tr>`;
    return;
  }

  // 병합 렌더링: 대회명/날짜 → 종별 → 종목/라운드 그룹
  let html = '';
  let prevComp='', prevKind='', prevEvent='', prevRound='';

  rows.forEach(h => {
    const comp  = h.competition_nm||'';
    const kind  = h.kind_nm||'';
    const event = h.event_nm||'';
    const round = h.round_nm||'';
    const date  = fmtDate(h.event_date);

    const newComp  = comp!==prevComp;
    const newKind  = newComp || kind!==prevKind;
    const newEvent = newKind || event!==prevEvent;
    const newRound = newEvent || round!==prevRound;

    if (newComp) {
      html += `<tr class="result-comp-header"><td colspan="5">📅 ${date} &nbsp;${comp}</td></tr>`;
    }
    if (newKind) {
      html += `<tr class="result-kind-header"><td colspan="5">▸ ${kind}</td></tr>`;
    }
    if (newEvent) {
      html += `<tr class="result-event-header"><td colspan="5">${event}</td></tr>`;
    }

    const rankNum = parseInt(h.rank);
    let rankCell;
    if (rankNum===1) rankCell = `<span class="rank-badge-sm rank-1">1</span>`;
    else if (rankNum===2) rankCell = `<span class="rank-badge-sm rank-2">2</span>`;
    else if (rankNum===3) rankCell = `<span class="rank-badge-sm rank-3">3</span>`;
    else rankCell = h.rank ? `<span class="rank-badge-sm rank-n">${h.rank}</span>` : '–';

    const roundShort = getRoundShort(round);
    const roundClass = getRoundClass(round);

    // 라운드가 바뀌면 라운드 칼럼에 표시, 같으면 병합표시
    const roundDisplay = newRound
      ? `<span class="round-tag ${roundClass}">${roundShort}</span>`
      : `<span style="color:var(--muted);font-size:0.68rem">″</span>`;

    html += `<tr>
      <td>${roundDisplay}</td>
      <td style="font-weight:700;color:var(--blue2)">${h._playerName||'–'}</td>
      <td style="font-size:0.75rem">${h.team_nm||''}</td>
      <td class="record-val">${h.record||'–'}</td>
      <td style="text-align:center">${rankCell}</td>
    </tr>`;

    prevComp=comp; prevKind=kind; prevEvent=event; prevRound=round;
  });

  tbody.innerHTML = html;
}

/* ══════════════════════════════════════════════
   유틸
══════════════════════════════════════════════ */
function debounce(fn, ms) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

function clearInput(id) {
  document.getElementById(id).value = '';
  document.getElementById(id).focus();
}

// 스크롤 탑 버튼
window.addEventListener('scroll', () => {
  document.getElementById('scrollTopBtn').classList.toggle('show', window.scrollY > 300);
});
document.getElementById('scrollTopBtn').addEventListener('click', () => {
  window.scrollTo({ top:0, behavior:'smooth' });
});
</script>
