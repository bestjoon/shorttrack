<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⛸ 쇼트트랙 기록 조회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════
   CSS 변수 & 리셋
══════════════════════════════════════════ */
:root {
  --bg: #f0f4fa;
  --surface: #ffffff;
  --surface2: #f7f9fd;
  --border: #e0e8f4;
  --border2: #d0ddf0;
  --navy: #0b2153;
  --blue: #1a4fa8;
  --blue2: #2563eb;
  --cyan: #06b6d4;
  --sky: #e8f2ff;
  --text: #0d1b3e;
  --text2: #3a5073;
  --muted: #8aa0be;
  --gold: #f59e0b;
  --silver: #94a3b8;
  --bronze: #b45309;
  --red: #ef4444;
  --green: #10b981;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 2px 12px rgba(11,33,83,0.10);
  --shadow-lg: 0 6px 28px rgba(11,33,83,0.16);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { font-size: 15px; }
body {
  font-family: 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior: none;
}

/* ══════════════════════════════════════════
   헤더
══════════════════════════════════════════ */
.app-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
  padding: 14px 16px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  box-shadow: var(--shadow-lg);
}
.header-left { display: flex; align-items: center; gap: 10px; }
.header-icon { font-size: 1.5rem; animation: sway 3s ease-in-out infinite; }
@keyframes sway { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(8deg)} }
.header-title { color: #fff; font-weight: 900; font-size: 1.05rem; letter-spacing: -0.3px; }
.header-sub { color: rgba(255,255,255,0.55); font-size: 0.68rem; margin-top: 1px; }
.btn-upload {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: #fff;
  border-radius: 20px;
  padding: 6px 13px;
  font-size: 0.75rem;
  font-family: inherit;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: background 0.2s;
  white-space: nowrap;
}
.btn-upload:active { background: rgba(255,255,255,0.28); }
#fileInput { display: none; }

/* ══════════════════════════════════════════
   하단 탭바
══════════════════════════════════════════ */
.tab-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 200;
  box-shadow: 0 -4px 16px rgba(11,33,83,0.08);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 9px 6px 8px;
  border: none;
  background: none;
  cursor: pointer;
  font-family: inherit;
  color: var(--muted);
  transition: color 0.2s;
  gap: 3px;
}
.tab-item.active { color: var(--blue2); }
.tab-icon { font-size: 1.3rem; }
.tab-label { font-size: 0.67rem; font-weight: 700; letter-spacing: 0.3px; }

/* ══════════════════════════════════════════
   페이지 레이아웃
══════════════════════════════════════════ */
.page-wrap {
  padding: 12px 12px calc(72px + env(safe-area-inset-bottom)) 12px;
}
.page { display: none; animation: fadeUp 0.22s ease; }
.page.active { display: block; }
@keyframes fadeUp {
  from { opacity:0; transform:translateY(8px); }
  to   { opacity:1; transform:translateY(0); }
}

/* ══════════════════════════════════════════
   필터 패널 (접기/펼치기)
══════════════════════════════════════════ */
.filter-panel {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.filter-toggle {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 15px;
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text2);
}
.filter-toggle:active { background: var(--sky); }
.filter-toggle-left { display: flex; align-items: center; gap: 8px; }
.filter-toggle-right { display: flex; align-items: center; gap: 8px; }
.filter-badge {
  background: var(--blue2);
  color: #fff;
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 0.68rem;
  font-weight: 700;
  display: none;
}
.filter-badge.show { display: inline-block; }
.chevron {
  font-size: 0.75rem;
  color: var(--muted);
  transition: transform 0.25s;
}
.filter-panel.open .chevron { transform: rotate(180deg); }
.filter-body {
  display: none;
  padding: 4px 14px 14px;
  border-top: 1px solid var(--border);
}
.filter-panel.open .filter-body { display: block; }

/* 필터 섹션 */
.filter-section { margin-top: 12px; }
.filter-label {
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 7px;
}
.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-btn {
  padding: 5px 13px;
  border-radius: 20px;
  border: 1.5px solid var(--border2);
  background: var(--surface2);
  color: var(--text2);
  font-size: 0.78rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  user-select: none;
  -webkit-user-select: none;
}
.chip-btn.selected {
  background: var(--blue2);
  border-color: var(--blue2);
  color: #fff;
}
.chip-btn:active { transform: scale(0.95); }

/* 텍스트 검색 */
.search-input-wrap {
  position: relative;
  margin-top: 12px;
}
.search-input {
  width: 100%;
  padding: 10px 14px 10px 38px;
  border: 1.5px solid var(--border2);
  border-radius: 10px;
  font-size: 0.88rem;
  font-family: inherit;
  background: var(--surface2);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus {
  border-color: var(--blue2);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
}
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: 1rem;
  pointer-events: none;
}
.btn-clear-text {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1rem;
  cursor: pointer;
  padding: 3px;
  display: none;
}
.search-input:not(:placeholder-shown) ~ .btn-clear-text { display: block; }

.filter-actions {
  display: flex;
  gap: 8px;
  margin-top: 13px;
  justify-content: flex-end;
}
.btn-reset {
  padding: 8px 16px;
  border: 1.5px solid var(--border2);
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text2);
  font-size: 0.8rem;
  font-family: inherit;
  cursor: pointer;
}
.btn-search {
  padding: 8px 20px;
  background: var(--blue2);
  border: none;
  border-radius: 8px;
  color: #fff;
  font-size: 0.82rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(37,99,235,0.3);
  display: flex;
  align-items: center;
  gap: 5px;
}
.btn-search:active { opacity: 0.85; }

/* ══════════════════════════════════════════
   결과 요약
══════════════════════════════════════════ */
.result-meta {
  font-size: 0.75rem;
  color: var(--muted);
  padding: 4px 2px 8px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.result-meta b { color: var(--blue2); font-size: 0.85rem; }

/* ══════════════════════════════════════════
   선수 목록 카드
══════════════════════════════════════════ */
.player-list { display: flex; flex-direction: column; gap: 8px; }
.player-card {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
  -webkit-user-select: none;
}
.player-card:active { background: var(--sky); transform: scale(0.99); }
.player-avatar {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 1rem;
  flex-shrink: 0;
}
.avatar-m { background: #dbeafe; color: #1d4ed8; }
.avatar-f { background: #fce7f3; color: #9d174d; }
.player-info { flex: 1; min-width: 0; }
.player-name { font-weight: 900; font-size: 1rem; letter-spacing: -0.3px; }
.player-meta { font-size: 0.73rem; color: var(--text2); margin-top: 2px; }
.player-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.tag {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.67rem;
  font-weight: 700;
}
.tag-kind { background: #eff6ff; color: #1d4ed8; }
.tag-sido { background: #f0fdf4; color: #15803d; }
.tag-year { background: #fef9ee; color: #92400e; }
.player-arrow { color: var(--muted); font-size: 0.9rem; }

/* ══════════════════════════════════════════
   빈 상태
══════════════════════════════════════════ */
.empty {
  text-align: center;
  padding: 56px 20px;
  color: var(--muted);
}
.empty-icon { font-size: 2.8rem; margin-bottom: 10px; opacity: 0.5; }
.empty p { font-size: 0.88rem; }
.empty .empty-sub { font-size: 0.74rem; margin-top: 5px; }

/* ══════════════════════════════════════════
   선수 상세 화면 (슬라이드 패널)
══════════════════════════════════════════ */
.detail-overlay {
  position: fixed;
  inset: 0;
  background: rgba(11,33,83,0.45);
  z-index: 500;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}
.detail-overlay.open { opacity: 1; pointer-events: auto; }

.detail-panel {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  top: 52px;
  background: var(--bg);
  border-radius: 18px 18px 0 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  z-index: 501;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
  overscroll-behavior: contain;
}
.detail-panel.open { transform: translateY(0); }

.detail-header {
  background: linear-gradient(135deg, var(--navy) 0%, var(--blue) 100%);
  padding: 16px 16px 14px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.detail-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.btn-back {
  background: rgba(255,255,255,0.2);
  border: none;
  color: #fff;
  border-radius: 50%;
  width: 34px; height: 34px;
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.detail-player-name { color: #fff; font-size: 1.4rem; font-weight: 900; letter-spacing: -0.5px; }
.detail-chips { display: flex; flex-wrap: wrap; gap: 5px; }
.dchip {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 0.72rem;
  font-weight: 700;
}
.dchip-m   { background: rgba(255,255,255,0.2); color: #93c5fd; }
.dchip-f   { background: rgba(255,255,255,0.2); color: #f9a8d4; }
.dchip-w   { background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.85); }

.detail-body { padding: 14px 12px; }

/* 정보 카드 */
.info-card {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  margin-bottom: 12px;
}
.section-title {
  font-size: 0.72rem;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--muted);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.info-item { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
.info-item-label { font-size: 0.67rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
.info-item-val { font-size: 0.9rem; font-weight: 700; margin-top: 3px; }

/* 메달 */
.medal-row { display: flex; gap: 8px; }
.medal-box {
  flex: 1;
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px 8px;
  text-align: center;
  border: 1.5px solid var(--border);
}
.medal-icon { font-size: 1.6rem; }
.medal-count { font-size: 1.5rem; font-weight: 900; margin-top: 2px; font-variant-numeric: tabular-nums; }
.medal-gold   .medal-count { color: var(--gold); }
.medal-silver .medal-count { color: var(--silver); }
.medal-bronze .medal-count { color: var(--bronze); }
.medal-label { font-size: 0.65rem; color: var(--muted); font-weight: 700; margin-top: 2px; }

/* 최고기록 테이블 */
.best-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.best-table th {
  background: var(--surface2);
  color: var(--muted);
  font-size: 0.67rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 7px 8px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
.best-table td {
  padding: 8px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.best-table tr:last-child td { border-bottom: none; }
.best-table td.record-val {
  font-weight: 700;
  color: var(--blue2);
  font-variant-numeric: tabular-nums;
}
.best-table tr:hover td { background: var(--sky); }

/* 대회기록 테이블 - 모바일 병합 */
.comp-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.comp-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.77rem;
  min-width: 480px;
}
.comp-table th {
  background: var(--surface2);
  color: var(--muted);
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 8px 8px;
  text-align: left;
  border-bottom: 1.5px solid var(--border);
  white-space: nowrap;
}
.comp-table td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  white-space: nowrap;
}
.comp-table tr:last-child td { border-bottom: none; }
.comp-table .td-merge {
  color: var(--muted);
  font-style: italic;
  font-size: 0.7rem;
}
.comp-table td.record-val { font-weight: 700; color: var(--blue2); }
.comp-table td.rank-cell { text-align: center; }
.rank-badge-sm {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 50%;
  font-size: 0.72rem;
  font-weight: 900;
}
.rank-1 { background: var(--gold); color: #fff; }
.rank-2 { background: var(--silver); color: #fff; }
.rank-3 { background: #cd7c2f; color: #fff; }
.rank-n { background: var(--surface2); color: var(--text2); }
.round-tag {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 8px;
  font-size: 0.68rem;
  font-weight: 700;
}
.round-final   { background: #fee2e2; color: #991b1b; }
.round-semi    { background: #fef3c7; color: #92400e; }
.round-qsemi   { background: #fff7ed; color: #c2410c; }
.round-prelim  { background: #f0f9ff; color: #0369a1; }
.round-heat    { background: var(--surface2); color: var(--muted); }
.comp-row-header {
  background: var(--sky);
  font-weight: 700;
  color: var(--blue);
  font-size: 0.75rem;
}
.comp-row-header td { padding: 8px 8px; border-bottom: 1px solid var(--border2); }

/* ══════════════════════════════════════════
   대회결과 탭
══════════════════════════════════════════ */
.result-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.result-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.78rem;
  min-width: 500px;
}
.result-table th {
  background: var(--surface2);
  color: var(--muted);
  font-size: 0.65rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  padding: 8px 9px;
  text-align: left;
  border-bottom: 1.5px solid var(--border);
  white-space: nowrap;
}
.result-table td {
  padding: 7px 9px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  white-space: nowrap;
}
.result-table tr:last-child td { border-bottom: none; }
.result-table td.record-val { font-weight: 700; color: var(--blue2); }
.result-comp-header td {
  background: var(--sky);
  font-weight: 700;
  color: var(--blue);
  font-size: 0.75rem;
  padding: 9px 9px;
  border-bottom: 1px solid var(--border2);
}
.result-kind-header td {
  background: #f8faff;
  font-weight: 700;
  color: var(--text2);
  font-size: 0.72rem;
  padding: 7px 9px;
  border-bottom: 1px solid var(--border);
  padding-left: 20px;
}
.result-event-header td {
  background: var(--surface);
  font-weight: 600;
  color: var(--text2);
  font-size: 0.7rem;
  padding: 6px 9px;
  border-bottom: 1px solid var(--border);
  padding-left: 32px;
  font-style: italic;
}

/* ══════════════════════════════════════════
   로딩 오버레이
══════════════════════════════════════════ */
.loading-screen {
  position: fixed;
  inset: 0;
  background: var(--navy);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  transition: opacity 0.4s;
}
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-logo { font-size: 3.5rem; animation: sway 1.5s ease-in-out infinite; }
.loading-title { color: #fff; font-weight: 900; font-size: 1.2rem; }
.loading-bar-wrap { width: 180px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; overflow: hidden; }
.loading-bar { height: 100%; background: var(--cyan); border-radius: 2px; width: 0; transition: width 0.4s ease; }
.loading-msg { color: rgba(255,255,255,0.55); font-size: 0.78rem; }

/* ══════════════════════════════════════════
   데이터 상태 배너
══════════════════════════════════════════ */
.data-banner {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.74rem;
  color: var(--text2);
  margin-bottom: 10px;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.banner-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}
.banner-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); animation: pulse 2s infinite; }
.banner-dot.err { background: var(--red); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ══════════════════════════════════════════
   스크롤 탑 버튼
══════════════════════════════════════════ */
.scroll-top {
  position: fixed;
  bottom: calc(68px + env(safe-area-inset-bottom));
  right: 14px;
  width: 38px; height: 38px;
  background: var(--blue2);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 1rem;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-lg);
  z-index: 100;
}
.scroll-top.show { display: flex; }
</style>
</head>
<body>

<!-- 로딩 화면 -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">⛸</div>

<script>
'use strict';
/* ══════════════════════════════════════════════
   전역 상태
══════════════════════════════════════════════ */
const DB = { players: [], history: [] };
let playerMap = {};
let playerHistoryMap = {};
let currentPlayers = [];
let currentResultRows = [];

/* ══════════════════════════════════════════════
   라운드 순서 정의
══════════════════════════════════════════════ */
const ROUND_ORDER = ['결승','준결승','준준결승','예선','예비예선'];

function getRoundLevel(rn) {
  if (!rn) return 99;
  const r = rn.replace(/\s/g,'');
  if (/^결승/.test(r)) return 0;
  if (/^준결승/.test(r)) return 1;
  if (/^준준결승/.test(r)) return 2;
  if (/^예선/.test(r)) return 3;
  if (/^예비예선/.test(r)) return 4;
  return 5;
}

function getRoundClass(rn) {
  const lvl = getRoundLevel(rn);
  if (lvl===0) return 'round-final';
  if (lvl===1) return 'round-semi';
  if (lvl===2) return 'round-qsemi';
  if (lvl===3) return 'round-prelim';
  return 'round-heat';
}

function getRoundShort(rn) {
  if (!rn) return '';
  // 준결승1조Semi Final 1 → 준결승1조
  return rn.replace(/[A-Za-z\s]+\d*$/,'').trim() || rn;
}

/* ══════════════════════════════════════════════
   날짜 파싱 / 포맷
══════════════════════════════════════════════ */
function normDate(d) {
  if (!d) return '';
  d = String(d).trim();
  // 2024.10.31 → 20241031
  if (/^\d{4}\.\d{2}\.\d{2}/.test(d)) return d.replace(/\./g,'').slice(0,8);
  // 2024-10-31 → 20241031
  if (/^\d{4}-\d{2}-\d{2}/.test(d)) return d.replace(/-/g,'').slice(0,8);
  return d.slice(0,8);
}

function fmtDate(d) {
  const s = normDate(d);
  if (s.length===8) return `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6,8)}`;
  return d || '';
}

/* ══════════════════════════════════════════════
   기록 파싱 (초)
══════════════════════════════════════════════ */
function parseTime(s) {
  if (!s) return null;
  s = s.trim();
  const m = s.match(/^(\d+):(\d+)\.(\d+)$/);
  if (m) {
    const frac = parseInt(m[3]) / Math.pow(10, m[3].length);
    return parseInt(m[1]) * 60 + parseInt(m[2]) + frac;
  }
  const m2 = s.match(/^(\d+)\.(\d+)$/);
  if (m2) return parseInt(m2[1]) + parseInt(m2[2]) / Math.pow(10, m2[2].length);
  return null;
}

/* ══════════════════════════════════════════════
   메달 판정
══════════════════════════════════════════════ */
function isMedalRound(rn) {
  if (!rn) return false;
  // 결승Final, 결승(오픈), 결승1조, 결승2조, 결승B 제외하고 결승으로 시작하는 것
  // 결승A는 메달, 결승B는 메달 아님(문제에서 결승 또는 결승A)
  const r = rn.replace(/\s/g,'');
  if (r === '결승B') return false;
  return /^결승/.test(r);
}

/* ══════════════════════════════════════════════
   데이터 초기화
══════════════════════════════════════════════ */
function initData(data, filename) {
  setLoading(60, '선수 데이터 구성 중...');
  DB.players = data.players || [];
  DB.history = data.history || data.records || [];

  playerMap = {};
  DB.players.forEach(p => { playerMap[p.player_id] = p; });

  setLoading(80, '기록 인덱싱 중...');
  playerHistoryMap = {};
  DB.history.forEach(h => {
    const p = playerMap[h.player_id];
    h._playerName = p ? p.name : (h.player_name || '');
    h._dateNorm = normDate(h.event_date);
    if (!playerHistoryMap[h.player_id]) playerHistoryMap[h.player_id] = [];
    playerHistoryMap[h.player_id].push(h);
  });

  setLoading(90, 'UI 구성 중...');
  buildBirthYearChips();
  buildKindChips();
  buildEventChips();

  const info = `선수 ${DB.players.length.toLocaleString()}명 · 기록 ${DB.history.length.toLocaleString()}건${filename?' · '+filename:''}`;
  document.getElementById('headerSub').textContent = info;
  document.getElementById('bannerText').textContent = info;
  document.getElementById('bannerDot').className = 'banner-dot ok';

  setLoading(100, '완료');
  setTimeout(() => {
    document.getElementById('loadingScreen').classList.add('hidden');
    runPlayerSearch();
  }, 300);
}

/* ══════════════════════════════════════════════
   자동 로드
══════════════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  setLoading(20, 'shorttrack_data.json 로딩 중...');
  try {
    const res = await fetch('shorttrack_data.json');
    if (!res.ok) throw new Error('fetch failed');
    setLoading(40, 'JSON 파싱 중...');
    const data = await res.json();
    initData(data, 'shorttrack_data.json');
  } catch(e) {
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('bannerText').textContent = '자동 로드 실패 — 📂 파일 교체 버튼으로 JSON 파일을 선택하세요';
    document.getElementById('bannerDot').className = 'banner-dot err';
    console.warn('Auto-load failed:', e.message);
  }
});

document.getElementById('fileInput').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  document.getElementById('loadingScreen').classList.remove('hidden');
  setLoading(20, '파일 읽는 중...');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      setLoading(50, 'JSON 파싱 중...');
      const data = JSON.parse(e.target.result);
      initData(data, file.name);
    } catch(err) {
      document.getElementById('loadingScreen').classList.add('hidden');
      alert('파일 파싱 오류: ' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  this.value = '';
});

function setLoading(pct, msg) {
  document.getElementById('loadingBar').style.width = pct + '%';
  document.getElementById('loadingMsg').textContent = msg;
}

/* ══════════════════════════════════════════════
   칩 빌더
══════════════════════════════════════════════ */
function buildBirthYearChips() {
  const years = [...new Set(DB.players.map(p=>p.birth_year).filter(Boolean))].sort((a,b)=>a-b);
  const container = document.getElementById('birthYearChips');
  container.innerHTML = years.map(y =>
    `<button class="chip-btn" data-val="${y}">${y}</button>`
  ).join('');
  container.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('selected'));
  });
}

function buildKindChips() {
  const kinds = [...new Set(DB.history.map(h=>h.kind_nm).filter(Boolean))].sort();
  const container = document.getElementById('kindChips');
  container.innerHTML = kinds.map(k =>
    `<button class="chip-btn" data-val="${k}">${k}</button>`
  ).join('');
  container.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('selected'));
  });
}

function buildEventChips() {
  const events = [...new Set(DB.history.map(h=>h.event_nm).filter(Boolean))].sort();
  const container = document.getElementById('eventChips');
  container.innerHTML = events.map(e =>
    `<button class="chip-btn" data-val="${e}">${e}</button>`
  ).join('');
  container.querySelectorAll('.chip-btn').forEach(btn => {
    btn.addEventListener('click', () => btn.classList.toggle('selected'));
  });
}

function getSelectedChips(containerId) {
  return [...document.querySelectorAll(`#${containerId} .chip-btn.selected`)].map(b => b.dataset.val);
}

function clearChips(containerId) {
  document.querySelectorAll(`#${containerId} .chip-btn`).forEach(b => b.classList.remove('selected'));
}

/* ══════════════════════════════════════════════
   필터 패널 토글
══════════════════════════════════════════════ */
function setupFilterPanel(panelId, toggleId) {
  const panel = document.getElementById(panelId);
  document.getElementById(toggleId).addEventListener('click', () => {
    panel.classList.toggle('open');
  });
}
setupFilterPanel('playerFilterPanel','playerFilterToggle');
setupFilterPanel('resultFilterPanel','resultFilterToggle');

// 성별 단일 선택
document.querySelectorAll('#genderChips .chip-btn').forEach(btn => {
  btn.addEventListener('click', () => btn.classList.toggle('selected'));
});
// 결과 라운드 칩
document.querySelectorAll('#roundFilterChips .chip-btn').forEach(btn => {
  btn.addEventListener('click', () => btn.classList.toggle('selected'));
});

/* ══════════════════════════════════════════════
   탭 전환
══════════════════════════════════════════════ */
document.querySelectorAll('.tab-item').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('page-' + tab.dataset.page).classList.add('active');
  });
});

/* ══════════════════════════════════════════════
   선수 조회
══════════════════════════════════════════════ */
document.getElementById('playerSearchBtn').addEventListener('click', () => runPlayerSearch());
document.getElementById('playerNameInput').addEventListener('keydown', e => { if(e.key==='Enter') runPlayerSearch(); });
document.getElementById('playerResetBtn').addEventListener('click', () => {
  clearChips('genderChips');
  clearChips('birthYearChips');
  document.getElementById('playerNameInput').value = '';
  updatePlayerBadge();
  runPlayerSearch();
});

function updatePlayerBadge() {
  const cnt = getSelectedChips('genderChips').length + getSelectedChips('birthYearChips').length +
    (document.getElementById('playerNameInput').value.trim() ? 1 : 0);
  const badge = document.getElementById('playerFilterBadge');
  badge.textContent = cnt;
  badge.classList.toggle('show', cnt > 0);
}

function runPlayerSearch() {
  updatePlayerBadge();
  const genders = getSelectedChips('genderChips');
  const years   = getSelectedChips('birthYearChips');
  const name    = document.getElementById('playerNameInput').value.trim();

  currentPlayers = DB.players.filter(p => {
    if (genders.length && !genders.includes(p.gender)) return false;
    if (years.length && !years.includes(p.birth_year)) return false;
    if (name && !p.name.includes(name)) return false;
    return true;
  }).sort((a,b) => {
    const na = parseInt(a.birth_year||0), nb = parseInt(b.birth_year||0);
    return na - nb || a.name.localeCompare(b.name, 'ko');
  });

  document.getElementById('playerResultMeta').innerHTML =
    `<b>${currentPlayers.length.toLocaleString()}</b> 명의 선수`;

  const list = document.getElementById('playerList');
  if (!currentPlayers.length) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>검색 결과가 없습니다</p><p class="empty-sub">조건을 변경해 보세요</p></div>`;
    return;
  }
  list.innerHTML = currentPlayers.map(p => {
    const initial = p.name.slice(0,1);
    const histCnt = (playerHistoryMap[p.player_id]||[]).length;
    return `<div class="player-card" onclick="openPlayerDetail('${p.player_id}')">
      <div class="player-avatar ${p.gender==='남'?'avatar-m':'avatar-f'}">${initial}</div>
      <div class="player-info">
        <div class="player-name">${p.name}</div>
        <div class="player-meta">${p.team_nm||''} · ${p.birth_year||''}년생 · 기록 ${histCnt}건</div>
        <div class="player-tags">
          <span class="tag tag-kind">${p.kind_nm||''}</span>
          <span class="tag tag-sido">${p.sido||''}</span>
          ${p.birth_year?`<span class="tag tag-year">${p.birth_year}</span>`:''}
        </div>
      </div>
      <div class="player-arrow">›</div>
    </div>`;
  }).join('');
}

/* ══════════════════════════════════════════════
   선수 상세
══════════════════════════════════════════════ */
function openPlayerDetail(pid) {
  const p = playerMap[pid];
  if (!p) return;

  const hist = (playerHistoryMap[pid]||[]).slice();

  // ── 기본 정보
  document.getElementById('dpName').textContent = p.name;
  document.getElementById('dpChips').innerHTML = `
    <span class="dchip ${p.gender==='남'?'dchip-m':'dchip-f'}">${p.gender==='남'?'♂ 남자':'♀ 여자'}</span>
    <span class="dchip dchip-w">${p.kind_nm||''}</span>
    <span class="dchip dchip-w">${p.sido||''}</span>
    <span class="dchip dchip-w">${p.birth_year||''}년생</span>
  `;

  // ── 메달 집계 (결승 또는 결승A라운드, 결승B 제외)
  let gold=0, silver=0, bronze=0;
  hist.forEach(h => {
    if (!isMedalRound(h.round_nm)) return;
    const r = parseInt(h.rank);
    if (r===1) gold++;
    else if (r===2) silver++;
    else if (r===3) bronze++;
  });

  // ── 연도/종목별 최고기록
  const bestMap = {}; // 'yyyy|event_nm' → {record, time, date, comp}
  hist.forEach(h => {
    if (!h.record) return;
    const t = parseTime(h.record);
    if (t === null) return;
    const yr = (h._dateNorm||'').slice(0,4) || '?';
    const key = `${yr}|${h.event_nm}`;
    if (!bestMap[key] || t < bestMap[key].time) {
      bestMap[key] = { year:yr, event:h.event_nm, record:h.record, time:t, date:h.event_date, comp:h.competition_nm };
    }
  });
  const bestList = Object.values(bestMap).sort((a,b)=>(a.year||'').localeCompare(b.year||'')||(a.event||'').localeCompare(b.event||''));

  // ── 대회기록 정렬 (날짜 내림차순, 같은 날짜면 라운드 순서)
  const sortedHist = hist.slice().sort((a,b) => {
    const dd = (b._dateNorm||'').localeCompare(a._dateNorm||'');
    if (dd!==0) return dd;
    return getRoundLevel(a.round_nm) - getRoundLevel(b.round_nm);
  });

  // ── HTML 빌드
  let html = '';

  // 기본정보
  html += `<div class="info-card">
    <div class="section-title">👤 기본 정보</div>
    <div class="info-grid">
      <div class="info-item"><div class="info-item-label">소속팀</div><div class="info-item-val">${p.team_nm||'–'}</div></div>
      <div class="info-item"><div class="info-item-label">등록구분</div><div class="info-item-val">${p.reg_type||'–'}</div></div>
      <div class="info-item"><div class="info-item-label">최종등록</div><div class="info-item-val">${p.last_reg_year||'–'}년</div></div>
      <div class="info-item"><div class="info-item-label">선수 ID</div><div class="info-item-val" style="font-size:0.72rem;word-break:break-all">${p.player_id}</div></div>
    </div>
  </div>`;

  // 메달
  html += `<div class="info-card">
    <div class="section-title">🏅 메달 현황 <span style="font-size:0.65rem;font-weight:400;color:var(--muted)">(결승 1·2·3위)</span></div>
    <div class="medal-row">
      <div class="medal-box medal-gold"><div class="medal-icon">🥇</div><div class="medal-count">${gold}</div><div class="medal-label">금메달</div></div>
      <div class="medal-box medal-silver"><div class="medal-icon">🥈</div><div class="medal-count">${silver}</div><div class="medal-label">은메달</div></div>
      <div class="medal-box medal-bronze"><div class="medal-icon">🥉</div><div class="medal-count">${bronze}</div><div class="medal-label">동메달</div></div>
    </div>
  </div>`;

  // 최고기록
  if (bestList.length) {
    html += `<div class="info-card">
      <div class="section-title">⏱ 연도/종목별 최고기록</div>
      <table class="best-table">
        <thead><tr><th>연도</th><th>종목</th><th>최고기록</th><th>대회</th></tr></thead>
        <tbody>`;
    bestList.forEach(b => {
      html += `<tr>
        <td>${b.year}</td>
        <td><b>${b.event}</b></td>
        <td class="record-val">${b.record}</td>
        <td style="font-size:0.68rem;color:var(--text2);max-width:120px;overflow:hidden;text-overflow:ellipsis" title="${b.comp}">${b.comp}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }

  // 대회기록 (병합 표시)
  html += `<div class="info-card" style="padding:0;overflow:hidden">
    <div style="padding:14px 14px 10px;border-bottom:1px solid var(--border)">
      <div class="section-title" style="margin-bottom:0">📋 대회 출전 기록 <span style="color:var(--muted);font-weight:400">(${sortedHist.length}건)</span></div>
    </div>
    <div class="comp-table-wrap">
      <table class="comp-table">
        <thead><tr>
          <th>대회명</th><th>종별</th><th>종목</th><th>경기일자</th>
          <th>라운드</th><th>기록</th><th style="text-align:center">순위</th>
        </tr></thead>
        <tbody>`;

  let prevComp='', prevKind='', prevEvent='', prevDate='';
  sortedHist.forEach(h => {
    const comp  = h.competition_nm||'';
    const kind  = h.kind_nm||'';
    const event = h.event_nm||'';
    const date  = fmtDate(h.event_date);
    const isSameComp  = comp===prevComp;
    const isSameKind  = isSameComp && kind===prevKind;
    const isSameEvent = isSameKind && event===prevEvent;
    const isSameDate  = isSameComp && date===prevDate;

    const rankNum = parseInt(h.rank);
    let rankCell;
    if (rankNum===1) rankCell = `<span class="rank-badge-sm rank-1">1</span>`;
    else if (rankNum===2) rankCell = `<span class="rank-badge-sm rank-2">2</span>`;
    else if (rankNum===3) rankCell = `<span class="rank-badge-sm rank-3">3</span>`;
    else rankCell = h.rank ? `<span class="rank-badge-sm rank-n">${h.rank}</span>` : '–';

    const roundShort = getRoundShort(h.round_nm);
    const roundClass = getRoundClass(h.round_nm);

    html += `<tr>
      <td style="max-width:130px;overflow:hidden;text-overflow:ellipsis" title="${comp}">${isSameComp?'<span class="td-merge">↳</span>':comp}</td>
      <td>${isSameKind?'<span class="td-merge">″</span>':kind}</td>
      <td><b>${isSameEvent?'<span class="td-merge">″</span>':event}</b></td>
      <td>${isSameDate?'<span class="td-merge">″</span>':date}</td>
      <td><span class="round-tag ${roundClass}">${roundShort}</span></td>
      <td class="record-val">${h.record||'–'}</td>
      <td class="rank-cell">${rankCell}</td>
    </tr>`;

    prevComp=comp; prevKind=kind; prevEvent=event; prevDate=date;
  });

  html += `</tbody></table></div></div>`;

  document.getElementById('detailBody').innerHTML = html;

  // 패널 오픈
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
  document.getElementById('detailPanel').scrollTop = 0;
}

document.getElementById('btnBack').addEventListener('click', closeDetail);
document.getElementById('detailOverlay').addEventListener('click', closeDetail);
function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
}

/* ══════════════════════════════════════════════
   대회 결과 조회
══════════════════════════════════════════════ */
document.getElementById('resultSearchBtn').addEventListener('click', () => runResultSearch());
document.getElementById('resultNameInput').addEventListener('keydown', e => { if(e.key==='Enter') runResultSearch(); });
document.getElementById('resultResetBtn').addEventListener('click', () => {
  clearChips('kindChips');
  clearChips('eventChips');
  clearChips('roundFilterChips');
  document.getElementById('resultNameInput').value = '';
  updateResultBadge();
  renderResultTable([]);
  document.getElementById('resultMeta').innerHTML = '';
});

function updateResultBadge() {
  const cnt = getSelectedChips('kindChips').length + getSelectedChips('eventChips').length +
    getSelectedChips('roundFilterChips').length +
    (document.getElementById('resultNameInput').value.trim() ? 1 : 0);
  const badge = document.getElementById('resultFilterBadge');
  badge.textContent = cnt;
  badge.classList.toggle('show', cnt > 0);
}

function runResultSearch() {
  updateResultBadge();
  const kinds   = getSelectedChips('kindChips');
  const events  = getSelectedChips('eventChips');
  const roundFs = getSelectedChips('roundFilterChips'); // ['결승','준결승',...]
  const name    = document.getElementById('resultNameInput').value.trim();

  let rows = DB.history.filter(h => {
    if (kinds.length  && !kinds.includes(h.kind_nm)) return false;
    if (events.length && !events.includes(h.event_nm)) return false;
    if (roundFs.length) {
      const lvl = getRoundLevel(h.round_nm);
      // 선택된 roundF 중 하나라도 매칭
      const match = roundFs.some(rf => {
        if (rf==='결승')   return lvl===0;
        if (rf==='준결승') return lvl===1;
        if (rf==='준준결승') return lvl===2;
        if (rf==='예선')   return lvl===3;
        if (rf==='예비예선') return lvl===4;
        return false;
      });
      if (!match) return false;
    }
    if (name && !h._playerName.includes(name)) return false;
    return true;
  });

  // 정렬: 날짜 내림차순, 같은 날짜+대회 내에서 종별, 종목, 라운드 순서
  rows.sort((a,b) => {
    const dd = (b._dateNorm||'').localeCompare(a._dateNorm||'');
    if (dd!==0) return dd;
    const cc = (a.competition_nm||'').localeCompare(b.competition_nm||'');
    if (cc!==0) return cc;
    const kk = (a.kind_nm||'').localeCompare(b.kind_nm||'');
    if (kk!==0) return kk;
    const ee = (a.event_nm||'').localeCompare(b.event_nm||'');
    if (ee!==0) return ee;
    const rr = getRoundLevel(a.round_nm) - getRoundLevel(b.round_nm);
    if (rr!==0) return rr;
    return parseInt(a.rank||99) - parseInt(b.rank||99);
  });

  currentResultRows = rows;
  document.getElementById('resultMeta').innerHTML = rows.length
    ? `<b>${rows.length.toLocaleString()}</b> 건의 기록`
    : '';
  renderResultTable(rows);
}

function renderResultTable(rows) {
  const tbody = document.getElementById('resultTableBody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty"><div class="empty-icon">🏆</div><p>조건을 설정하고 조회하세요</p></div></td></tr>`;
    return;
  }

  // 병합 렌더링: 대회명/날짜 → 종별 → 종목/라운드 그룹
  let html = '';
  let prevComp='', prevKind='', prevEvent='', prevRound='';

  rows.forEach(h => {
    const comp  = h.competition_nm||'';
    const kind  = h.kind_nm||'';
    const event = h.event_nm||'';
    const round = h.round_nm||'';
    const date  = fmtDate(h.event_date);

    const newComp  = comp!==prevComp;
    const newKind  = newComp || kind!==prevKind;
    const newEvent = newKind || event!==prevEvent;
    const newRound = newEvent || round!==prevRound;

    if (newComp) {
      html += `<tr class="result-comp-header"><td colspan="5">📅 ${date} &nbsp;${comp}</td></tr>`;
    }
    if (newKind) {
      html += `<tr class="result-kind-header"><td colspan="5">▸ ${kind}</td></tr>`;
    }
    if (newEvent) {
      html += `<tr class="result-event-header"><td colspan="5">${event}</td></tr>`;
    }

    const rankNum = parseInt(h.rank);
    let rankCell;
    if (rankNum===1) rankCell = `<span class="rank-badge-sm rank-1">1</span>`;
    else if (rankNum===2) rankCell = `<span class="rank-badge-sm rank-2">2</span>`;
    else if (rankNum===3) rankCell = `<span class="rank-badge-sm rank-3">3</span>`;
    else rankCell = h.rank ? `<span class="rank-badge-sm rank-n">${h.rank}</span>` : '–';

    const roundShort = getRoundShort(round);
    const roundClass = getRoundClass(round);

    // 라운드가 바뀌면 라운드 칼럼에 표시, 같으면 병합표시
    const roundDisplay = newRound
      ? `<span class="round-tag ${roundClass}">${roundShort}</span>`
      : `<span style="color:var(--muted);font-size:0.68rem">″</span>`;

    html += `<tr>
      <td>${roundDisplay}</td>
      <td style="font-weight:700;color:var(--blue2)">${h._playerName||'–'}</td>
      <td style="font-size:0.75rem">${h.team_nm||''}</td>
      <td class="record-val">${h.record||'–'}</td>
      <td style="text-align:center">${rankCell}</td>
    </tr>`;

    prevComp=comp; prevKind=kind; prevEvent=event; prevRound=round;
  });

  tbody.innerHTML = html;
}

/* ══════════════════════════════════════════════
   유틸
══════════════════════════════════════════════ */
function clearInput(id) {
  document.getElementById(id).value = '';
  document.getElementById(id).focus();
}

// 스크롤 탑 버튼
window.addEventListener('scroll', () => {
  document.getElementById('scrollTopBtn').classList.toggle('show', window.scrollY > 300);
});
document.getElementById('scrollTopBtn').addEventListener('click', () => {
  window.scrollTo({ top:0, behavior:'smooth' });
});
</script>
