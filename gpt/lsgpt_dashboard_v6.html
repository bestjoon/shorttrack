<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LS GPT 부서별 사용 현황</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f4f6f9;padding:20px;color:#222}
.wrap{max-width:1200px;margin:0 auto;background:#fff;border-radius:12px;padding:24px 28px;box-shadow:0 2px 14px rgba(0,0,0,0.09)}

/* ── 상단 ── */
.top-bar{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-bottom:16px;border-bottom:1.5px solid #e0e6f0;margin-bottom:20px}
.top-left .title{font-size:18px;font-weight:700;color:#1F5C99}
.top-left .sub{font-size:12px;color:#777;margin-top:3px}
.top-left .notice{font-size:11px;color:#1D9E75;margin-top:5px;font-weight:500}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;background:#E6F1FB;color:#185FA5;margin-left:6px;vertical-align:middle;font-weight:600}

/* ── 필터 ── */
.filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-row label{font-size:12px;color:#555;font-weight:600;white-space:nowrap}
.filter-row select{font-size:13px;height:34px;padding:0 10px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer}
.fsep{width:1px;height:22px;background:#ddd;margin:0 2px}

/* ── KPI 카드 ── */
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.kcard{background:#f5f7fa;border-radius:8px;padding:14px 16px;border-left:4px solid #ccc}
.kcard.ok{background:#E1F5EE;border-left-color:#1D9E75}
.kcard.ng{background:#FCEBEB;border-left-color:#E24B4A}
.kcard.blue{background:#EEF4FC;border-left-color:#4472C4}
.klbl{font-size:11px;color:#888;margin-bottom:5px;font-weight:600}
.kcard.ok .klbl{color:#0F6E56}
.kcard.ng .klbl{color:#A32D2D}
.kcard.blue .klbl{color:#185FA5}
.kval{font-size:26px;font-weight:700;color:#222;line-height:1.1}
.kcard.ok .kval{color:#1D9E75}
.kcard.ng .kval{color:#E24B4A}
.kcard.blue .kval{color:#1F5C99}
.ksub{font-size:11px;color:#aaa;margin-top:4px}

/* ── 메인 패널 (팀 선택 시) ── */
.main-row{display:grid;grid-template-columns:210px 1fr;gap:14px;margin-bottom:20px}
.panel{background:#fff;border:1px solid #e0e6f0;border-radius:10px;padding:16px 18px}
.ptitle{font-size:13px;font-weight:600;color:#333;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #f0f0f0}

/* ── 게이지 ── */
.gauge-area{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 0}
.gauge-ring{position:relative;width:140px;height:140px}
.gc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gpct{font-size:30px;font-weight:700}
.gsub{font-size:11px;color:#888}
.goal-note{font-size:11px;color:#888;display:flex;align-items:center;gap:5px}
.gdot{width:8px;height:8px;border-radius:50%;background:#E24B4A;flex-shrink:0}
.gresult{font-size:12px;text-align:center;line-height:1.7}

/* ── 멤버 테이블 ── */
.mtable{width:100%;border-collapse:collapse;font-size:13px}
.mtable th{font-size:11px;font-weight:600;color:#888;padding:6px 10px;border-bottom:2px solid #eee;text-align:left;background:#fafafa;white-space:nowrap}
.mtable td{padding:6px 10px;border-bottom:1px solid #f5f5f5;vertical-align:middle}
.mtable tr:last-child td{border-bottom:none}
.mtable tr.zero td{opacity:.45}
.mtable tr:hover:not(.zero) td{background:#fafcff}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.ok-pill{background:#E1F5EE;color:#0F6E56}
.ng-pill{background:#FCEBEB;color:#A32D2D}
.mini-bg{height:5px;background:#eee;border-radius:3px;width:72px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
.mini-fill{height:100%;border-radius:3px}
.htag{font-size:10px;background:#f0f0f0;color:#888;padding:1px 5px;border-radius:3px;margin-left:4px;vertical-align:middle}

/* ── 연간 KPI (단일 팀) ── */
.annual-panel{background:#fff;border:1px solid #e0e6f0;border-radius:10px;padding:16px 18px}
.annual-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin:12px 0}
.mcol{display:flex;flex-direction:column;align-items:center;gap:4px}
.mbox{width:100%;min-height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:default}
.mp{background:#E1F5EE;color:#0F6E56}
.mf{background:#FCEBEB;color:#A32D2D}
.mfut{background:#f5f5f5;color:#bbb}
.mlb{font-size:10px;color:#aaa;text-align:center}
.annual-foot{display:flex;align-items:center;justify-content:space-between;padding-top:14px;border-top:1px solid #f0f0f0;margin-top:4px;flex-wrap:wrap;gap:12px}
.grade-big{font-size:40px;font-weight:700}
.gs{color:#1D9E75}.ga{color:#185FA5}.gna{color:#aaa}
.ginfo{font-size:12px;color:#666;line-height:1.8}
.prog-row{display:flex;align-items:center;gap:8px;font-size:12px;margin-bottom:6px}
.prog-lbl{color:#888;width:48px;text-align:right;flex-shrink:0;font-weight:500}
.prog-bg{width:130px;height:8px;background:#eee;border-radius:4px;overflow:hidden}
.prog-fill{height:100%;border-radius:4px;transition:width .5s}
.prog-count{font-weight:700;color:#444;min-width:36px;font-size:12px}
.kiji-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:3px;background:#FFF3CD;color:#856404;margin-left:4px;font-weight:600;vertical-align:middle}

/* ── [전체] 뷰: 팀별 연간 KPI 그리드 테이블 ── */
.all-view{margin-top:0}
.all-panel{background:#fff;border:1px solid #e0e6f0;border-radius:10px;padding:0;overflow:hidden}
.all-panel-title{font-size:13px;font-weight:600;color:#333;padding:14px 18px 10px;border-bottom:1px solid #f0f0f0;background:#fafafa;display:flex;align-items:center;justify-content:space-between}
.all-table{width:100%;border-collapse:collapse;font-size:12px}
.all-table th{padding:8px 10px;border-bottom:1.5px solid #e0e6f0;border-right:1px solid #eee;background:#f5f7fa;font-weight:600;color:#555;text-align:center;white-space:nowrap}
.all-table th.team-hdr{text-align:left;min-width:110px;background:#f0f4ff;color:#1F5C99}
.all-table td{padding:6px 8px;border-bottom:1px solid #f0f0f0;border-right:1px solid #f5f5f5;text-align:center;vertical-align:middle}
.all-table td.team-name{text-align:left;font-weight:600;color:#333;padding-left:12px;background:#fafcff;white-space:nowrap}
.all-table tr:last-child td{border-bottom:none}
.all-table tr:hover td{background:#fafcff}
.all-table tr:hover td.team-name{background:#f0f4ff}
/* 월 셀 */
.cell-p{display:flex;flex-direction:column;align-items:center;gap:2px}
.cell-tick{font-size:13px;font-weight:700}
.cell-pct{font-size:10px;font-weight:600}
.cell-sub{font-size:10px;color:#888}
.cell-na{color:#ccc;font-size:13px}
/* 달성 카운트 열 */
.ach-count{font-weight:700;color:#444;background:#f5f7fa}
/* 헤더 월 색 */
.th-data{color:#444;background:#f5f7fa}
.th-future{color:#ccc;background:#fafafa}

@media(max-width:700px){.main-row{grid-template-columns:1fr}.kpi-row{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

    <div class="annual-panel">

      </div>
      <div style="overflow-x:auto">

  </div>

</div>

const MA=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12'];

const DYM=new Set(D.months);

function lookup(dept,ym){return D.data.find(d=>d.departName===dept&&d.ym===ym)||null}

// 직보조직 2개를 하나로 합쳐 맨 아래 배치
const FLAT_HONBU=(()=>{
  const list=[];
  const jikcalItems=[];
  D.org.forEach(b=>{
    b.children.forEach(h=>{
      if(h.name==='직보조직'){
        jikcalItems.push(...(h.items||[]));
      } else {
        list.push({bunbu:b.bunbu,name:h.name,display:h.name,items:h.items||[]});
      }
    });
  });
  if(jikcalItems.length>0){
    list.push({bunbu:'직보조직',name:'직보조직',display:'직보조직',items:jikcalItems});
  }
  return list;
})();

function getHonbu(display){return FLAT_HONBU.find(h=>h.display===display)||null}

function initFilters(){
  const fh=document.getElementById('fHonbu');
  FLAT_HONBU.forEach(h=>{
    const o=document.createElement('option');o.value=h.display;o.textContent=h.display;fh.appendChild(o);
  });
  fh.value='경영지원실';
  onHonbuChange(true);
  const fm=document.getElementById('fMonth');
  D.months.forEach(m=>{
    const o=document.createElement('option');o.value=m;
    const [y,mo]=m.split('-');o.textContent=y+'년 '+parseInt(mo)+'월';fm.appendChild(o);
  });
  fm.value=D.months[D.months.length-1];
}

function onHonbuChange(init){
  const display=document.getElementById('fHonbu').value;
  const fd=document.getElementById('fDept');
  fd.innerHTML='';
  // [전체] 항목 맨 앞에 추가
  const allOpt=document.createElement('option');
  allOpt.value='__ALL__';allOpt.textContent='[전체]';
  fd.appendChild(allOpt);
  const h=getHonbu(display);
  if(h){
    h.items.forEach(it=>{
      const o=document.createElement('option');
      o.value=it.name;
      o.textContent=it.name+(it.type==='kiji'?' (기지 합산)':'');
      fd.appendChild(o);
    });
  }
  fd.value='__ALL__';  // 기본값: [전체]
  if(!init) render();
}

function render(){
  const dept=document.getElementById('fDept').value;
  const ym=document.getElementById('fMonth').value;
  const honbu=document.getElementById('fHonbu').value;

  if(dept==='__ALL__'){
    document.getElementById('single-view').style.display='none';
    document.getElementById('all-view').style.display='block';
    renderAllView(honbu);
  } else {
    document.getElementById('single-view').style.display='block';
    document.getElementById('all-view').style.display='none';
    const rec=lookup(dept,ym);
    renderKPI(rec,ym,dept);
    renderGauge(rec);
    renderMembers(rec,dept);
    renderAnnual(dept);
  }
}

/* ── [전체] 뷰: 팀별 연간 KPI 테이블 ── */
function renderAllView(honbu){
  const h=getHonbu(honbu);
  if(!h) return;
  // 기지 합산 항목(is_kiji) 제외하고 팀만
  const teams=h.items.filter(it=>it.type!=='kiji').map(it=>it.name);

  document.getElementById('all-title').textContent=
    honbu+' — 팀별 연간 KPI 추적 (2026년)';

  // 헤더: 팀 | 1월 | 2월 | … | 12월 | 달성수
  let thead='<thead><tr>'
    +'<th class="team-hdr">팀명</th>';
  MA.forEach((m,i)=>{
    const cls=DYM.has(m)?'th-data':'th-future';
    thead+='<th class="'+cls+'">'+ML[i]+'</th>';
  });
  thead+='<th class="th-data" style="background:#f0f4ff;color:#1F5C99;min-width:110px;width:110px">달성현황</th></tr></thead>';

  // 바디
  let tbody='<tbody>';
  teams.forEach(team=>{
    let achCount=0;
    let trow='<tr><td class="team-name">'+team+'</td>';
    MA.forEach((m,i)=>{
      const has=DYM.has(m);
      const rec=has?lookup(team,m):null;
      if(!has){
        trow+='<td class="cell-na">—</td>';
      } else if(!rec){
        trow+='<td class="cell-na">?</td>';
      } else {
        const pct=Math.round(rec.usage_rate*10)/10;
        const ach=rec.achieved;
        if(ach) achCount++;
        const color=ach?'#1D9E75':(pct>=20?'#EF9F27':'#E24B4A');
        const bg=ach?'#F0FBF6':(pct>=20?'#FFFBF0':'#FFF5F5');
        trow+='<td style="background:'+bg+'">'
          +'<div class="cell-p">'
          +'<span class="cell-tick" style="color:'+color+'">'+(ach?'✓':'✗')+'</span>'
          +'<span class="cell-pct" style="color:'+color+'">'+pct+'%</span>'
          +'<span class="cell-sub">'+rec.users_5plus+'/'+rec.total+'명</span>'
          +'</div></td>';
      }
    });
    // 달성현황: S/A 바차트 2줄
    const sW=Math.min(100,Math.round(achCount/8*100));
    const aW=Math.min(100,Math.round(achCount/6*100));
    trow+=''
      +'<td class="ach-count" style="padding:5px 8px;vertical-align:middle;width:110px">'
        +'<div style="display:flex;align-items:center;gap:3px;margin-bottom:3px">'
          +'<span style="font-size:9px;color:#999;white-space:nowrap;flex-shrink:0;width:30px">S등급</span>'
          +'<div style="width:36px;height:5px;background:#e0e0e0;border-radius:2px;overflow:hidden;flex-shrink:0">'
            +'<div style="width:'+sW+'%;height:100%;background:#1D9E75;border-radius:2px"></div>'
          +'</div>'
          +'<span style="font-size:9px;font-weight:700;color:'+(achCount>=8?'#1D9E75':'#999')+';white-space:nowrap;margin-left:2px">'+achCount+'/8</span>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:3px">'
          +'<span style="font-size:9px;color:#999;white-space:nowrap;flex-shrink:0;width:30px">A등급</span>'
          +'<div style="width:36px;height:5px;background:#e0e0e0;border-radius:2px;overflow:hidden;flex-shrink:0">'
            +'<div style="width:'+aW+'%;height:100%;background:#185FA5;border-radius:2px"></div>'
          +'</div>'
          +'<span style="font-size:9px;font-weight:700;color:'+(achCount>=6?'#185FA5':'#999')+';white-space:nowrap;margin-left:2px">'+achCount+'/6</span>'
        +'</div>'
      +'</td>';
    trow+='</tr>';
    tbody+=trow;
  });
  tbody+='</tbody>';

  document.getElementById('all-table').innerHTML=thead+tbody;

  // 별도 grade-footer 제거 (이미 컬럼에 통합됨)
  const panel=document.getElementById('all-table').closest('.all-panel');
  const existing=panel.querySelector('.grade-footer');
  if(existing) existing.remove();
}

/* ── 단일 팀 뷰 ── */
function renderKPI(rec,ym,dept){
  const mo=parseInt(ym.split('-')[1]);
  document.getElementById('kl0').textContent=mo+'월 사용률';
  if(!rec){
    document.getElementById('kv0').textContent='데이터 없음';
    document.getElementById('kc0').className='kcard';
    ['kv1','kv2','kv3'].forEach(id=>document.getElementById(id).textContent='—');
    ['ks1','ks2','ks3'].forEach(id=>document.getElementById(id).textContent='');
    return;
  }
  const pct=Math.round(rec.usage_rate*10)/10;
  document.getElementById('kv0').textContent=pct+'%';
  document.getElementById('kc0').className='kcard '+(rec.achieved?'ok':'ng');
  document.getElementById('kv1').textContent=rec.users_5plus+'명';
  document.getElementById('ks1').textContent='전체 '+rec.total+'명 중';
  document.getElementById('kv2').textContent=rec.total+'명';
  document.getElementById('ks2').textContent='임직원 마스터 기준';
  const ach=D.months.filter(m=>{const r=lookup(dept,m);return r&&r.achieved}).length;
  document.getElementById('kv3').textContent=ach+'/'+D.months.length+'개월';
  document.getElementById('ks3').textContent='1~'+D.months.length+'월 집계';
}

function renderGauge(rec){
  if(!rec){setGauge(0,false);document.getElementById('gresult').textContent='';return}
  const pct=Math.round(rec.usage_rate*10)/10;
  setGauge(pct,rec.achieved);
  const el=document.getElementById('gresult');
  if(rec.achieved){
    el.innerHTML='<span style="color:#1D9E75;font-weight:600">✓ KPI 달성</span><br><span style="font-size:11px;color:#888">'+rec.users_5plus+'명 / '+rec.total+'명 달성</span>';
  } else {
    const need=Math.max(0,Math.ceil(rec.total*0.3)-rec.users_5plus);
    el.innerHTML='<span style="color:#E24B4A;font-weight:600">✗ 미달성</span><br><span style="font-size:11px;color:#888">'+need+'명 추가 필요</span>';
  }
}

function setGauge(pct,ach){
  const offset=358-(pct/100)*358;
  const fill=document.getElementById('gfill');
  fill.style.strokeDashoffset=offset;
  fill.style.stroke=ach?'#1D9E75':(pct>=20?'#EF9F27':'#E24B4A');
  document.getElementById('gpct').textContent=pct+'%';
  document.getElementById('gpct').style.color=ach?'#1D9E75':'#E24B4A';
}

function renderMembers(rec,dept){
  const el=document.getElementById('members-area');
  const isKiji=rec&&rec.is_kiji;
  document.getElementById('mtitle').innerHTML='부서원별 사용 현황'+(isKiji?'<span class="kiji-badge">기지 합산</span>':'');
  if(!rec||!rec.members||!rec.members.length){
    el.innerHTML='<div style="text-align:center;color:#bbb;font-size:13px;padding:2rem 0">데이터 없음</div>';return;
  }
  const max=Math.max(...rec.members.map(m=>m.days_used),1);
  let rows='';
  rec.members.forEach(m=>{
    const ok=m.days_used>=5;
    const bw=Math.round(m.days_used/max*100);
    const fc=ok?'#1D9E75':(m.days_used>=3?'#EF9F27':'#E24B4A');
    const cls=m.days_used===0?'zero':'';
    const hTag=m.hrstat==='휴직'?'<span class="htag">휴직</span>':'';
    rows+='<tr class="'+cls+'"><td>'+m.name+hTag+'</td>'
      +'<td style="text-align:center"><span class="pill '+(ok?'ok-pill':'ng-pill')+'">'+m.days_used+'일</span></td>'
      +'<td><div class="mini-bg"><div class="mini-fill" style="width:'+bw+'%;background:'+fc+'"></div></div></td>'
      +'<td style="text-align:center"><span class="pill '+(ok?'ok-pill':'ng-pill')+'">'+(ok?'달성':'미달성')+'</span></td></tr>';
  });
  el.innerHTML='<table class="mtable"><thead><tr><th>이름</th><th>사용일수</th><th>사용량</th><th>달성</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function renderAnnual(dept){
  const grid=document.getElementById('annual-grid');
  let achieved=0;
  grid.innerHTML=MA.map((m,i)=>{
    const has=DYM.has(m);
    const rec=has?lookup(dept,m):null;
    let cls,lbl;
    if(!has){cls='mfut';lbl='—'}
    else if(!rec){cls='mfut';lbl='?'}
    else if(rec.achieved){cls='mp';lbl='✓';achieved++}
    else{cls='mf';lbl='✗'}
    const tip=rec?ML[i]+': '+Math.round(rec.usage_rate)+'% ('+rec.users_5plus+'/'+rec.total+'명)':ML[i];
    return '<div class="mcol"><div class="mbox '+cls+'" title="'+tip+'">'+lbl+'</div><div class="mlb">'+ML[i]+'</div></div>';
  }).join('');
  const gv=document.getElementById('grade-val');
  const gi=document.getElementById('grade-info');
  if(achieved>=8){gv.textContent='S';gv.className='grade-big gs';gi.innerHTML='<strong>'+achieved+'개월 달성</strong><br>S등급 달성!'}
  else if(achieved>=6){gv.textContent='A';gv.className='grade-big ga';gi.innerHTML='<strong>'+achieved+'개월 달성</strong><br>A등급 달성!'}
  else{gv.textContent=achieved+'개';gv.className='grade-big gna';gi.innerHTML='<strong>'+achieved+'개월 달성</strong> (현재)<br>S등급 '+(8-achieved)+'개월, A등급 '+Math.max(0,6-achieved)+'개월 더 필요'}
  document.getElementById('pb-s').style.width=Math.min(100,Math.round(achieved/8*100))+'%';
  document.getElementById('pb-a').style.width=Math.min(100,Math.round(achieved/6*100))+'%';
  document.getElementById('pc-s').textContent=achieved+'/8';
  document.getElementById('pc-a').textContent=achieved+'/6';
}

initFilters();
render();
</script>
