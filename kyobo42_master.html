<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제42회 교보생명컵 - 마스터 컨트롤 시트</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --deep:#0a1628; --accent:#00c9ff; --gold:#f5c842;
    --card:#0f2540; --border:#1e3f62; --text:#cde0f0; --muted:#6a8fa8; --day1:#1a6fa8;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--deep); color:var(--text);
    font-family:'Noto Sans KR',sans-serif; min-height:100vh; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 80% 40% at 50% 20%, rgba(0,201,255,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 80% 80%, rgba(26,111,168,0.08) 0%, transparent 60%);
  }
  .container { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:0 4px 50px; }
  @media (min-width:600px){ .container{ padding:0 14px 60px; } }

  header { text-align:center; padding:14px 0 12px; border-bottom:1px solid var(--border); margin-bottom:12px; }
  header h1 {
    font-family:'Black Han Sans',sans-serif; font-size:clamp(17px,3.5vw,28px);
    letter-spacing:-0.5px; line-height:1.3; margin-bottom:6px;
    background:linear-gradient(135deg,#fff 0%,var(--accent) 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .date-chip { font-size:12px; color:var(--muted); letter-spacing:0.5px; }
  .notice-text { margin-top:6px; font-size:10px; color:var(--muted); line-height:1.5; }

  /* search */
  .search-wrap {
    position:sticky; top:0; z-index:100; background:rgba(10,22,40,0.95);
    backdrop-filter:blur(12px); padding:8px 0; border-bottom:1px solid var(--border); margin-bottom:12px;
  }
  .search-inner { max-width:1100px; margin:0 auto; padding:0 8px; display:flex; gap:10px; align-items:center; }
  .search-box { flex:1; position:relative; }
  .search-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:16px; }
  #searchInput {
    width:100%; background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:9px 14px 9px 40px; color:#fff; font-size:14px; font-family:'Noto Sans KR',sans-serif; outline:none;
  }
  #searchInput:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(0,201,255,0.12); }
  #searchInput::placeholder { color:var(--muted); }
  #searchCount { font-size:12px; color:var(--accent); font-weight:600; min-width:44px; text-align:right; }

  .group-tabs { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
  .group-tab {
    padding:5px 9px; border-radius:20px; font-size:11px; font-weight:600; cursor:pointer;
    border:1px solid var(--border); background:rgba(255,255,255,0.04); color:var(--muted);
    font-family:'Noto Sans KR',sans-serif; transition:all 0.15s;
  }
  .group-tab:hover { color:var(--text); background:rgba(255,255,255,0.1); }
  .group-tab.active { background:rgba(0,201,255,0.16); border-color:var(--accent); color:var(--accent); }

  .day-header {
    display:flex; align-items:center; gap:10px; margin-bottom:12px;
    padding-bottom:9px; border-bottom:1px solid var(--border);
  }
  .day-dot { width:12px; height:12px; border-radius:50%; background:var(--day1); box-shadow:0 0 10px var(--day1); flex-shrink:0; }
  .day-title { font-family:'Black Han Sans',sans-serif; font-size:18px; letter-spacing:0.5px; }
  .day-date { font-size:11px; color:var(--muted); margin-left:auto; }

  .section-controls { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
  .ctrl-btn {
    padding:6px 10px; font-size:11px; font-weight:600; letter-spacing:0.4px; border-radius:6px;
    cursor:pointer; border:1px solid var(--border); background:rgba(255,255,255,0.04);
    color:var(--muted); font-family:'Noto Sans KR',sans-serif; transition:all 0.15s;
  }
  .ctrl-btn:hover { background:rgba(255,255,255,0.1); color:var(--text); }
  .mode-label { font-size:11px; color:var(--muted); letter-spacing:0.3px; margin-right:2px; }
  .ctrl-btn.mode-btn.active { background:rgba(0,201,255,0.18); border-color:var(--accent); color:var(--accent); }

  .master-block { margin-bottom:18px; }
  .master-block-title {
    font-size:12px; font-weight:700; color:var(--accent); letter-spacing:0.5px;
    margin:0 0 6px 2px; display:flex; align-items:baseline; gap:6px;
  }
  .master-block-title .cnt { color:var(--muted); font-weight:500; font-size:10px; }

  .table-scroll {
    overflow-x:auto; border:1px solid var(--border); border-radius:10px;
    background:var(--card); -webkit-overflow-scrolling:touch;
  }
  table.master { border-collapse:separate; border-spacing:0; width:100%; font-size:11px; white-space:nowrap; }
  table.master th, table.master td {
    border-right:1px solid rgba(30,63,98,0.9); border-bottom:1px solid rgba(30,63,98,0.9);
    padding:4px 5px; text-align:center;
  }
  table.master thead th {
    background:#143255; color:#9fd4f0; font-weight:700; font-size:10px; position:sticky; top:0;
  }
  table.master thead th.dist-head { background:#17406b; color:#d6efff; }
  table.master td { background:var(--card); }
  table.master td.name { text-align:left; font-weight:600; color:#e0eefa; }
  table.master td.name.seongnam { color:#ffe066; }
  table.master td.org { text-align:left; color:var(--muted); font-size:10px; }
  table.master td.fa { background:rgba(72,149,239,0.16); font-weight:700; color:#bcdcff; }
  table.master td.rk { background:rgba(245,200,66,0.10); font-weight:700; color:#f0d891; }
  table.master td.fp { font-weight:800; color:#fff; }
  table.master td.trk { background:rgba(245,200,66,0.18); font-weight:800; color:var(--gold); }
  table.master td.pen { color:#e63946; font-size:9px; }
  table.master td.rk.dns { color:var(--muted); font-weight:500; }
  table.master tr.hit td { background:rgba(245,200,66,0.14); }

  table.master th.c-no, table.master td.c-no { position:sticky; left:0; z-index:2; min-width:26px; }
  table.master th.c-name, table.master td.c-name { position:sticky; left:26px; z-index:2; min-width:58px; }
  table.master thead th.c-no, table.master thead th.c-name { z-index:3; }

  .master-note { font-size:10px; color:var(--muted); margin:8px 2px 0; line-height:1.6; }
  .hidden { display:none !important; }
  .updated-at { text-align:center; font-size:10px; color:var(--muted); padding:16px 0 0; }

  ::-webkit-scrollbar { width:6px; height:6px; }
  ::-webkit-scrollbar-track { background:var(--deep); }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<div class="search-wrap">
  <div class="search-inner">
    <div class="search-box">
      <span class="search-icon">🔍</span>

    </div>
    <span id="searchCount"></span>
  </div>
</div>

<div class="container">

</div>

const FINAL_DEPTH = 4;

const cmpNum = (p, q) => (p === q ? 0 : (p < q ? -1 : 1));

function parseRecord(rec) {
  if (!rec) return Infinity;
  let m = String(rec).match(/^(\d+):(\d+\.?\d*)$/);
  if (m) return parseFloat(m[1]) * 60 + parseFloat(m[2]);
  m = String(rec).match(/^(\d+\.?\d*)$/);
  if (m) return parseFloat(m[1]);
  return Infinity;
}
function isSpecial(rec) {
  const s = String(rec || '').toUpperCase().replace(/[^A-Z]/g, '');
  return !!s && /DNF|DNS|DSQ|PEN|PRN|NOTIME|NT|AB|YC/.test(s);
}
const hasYC = rec => /YC/i.test(String(rec || ''));

// 한 경기 내 순서: 완주 → DNF(no time) → PEN → DNS
function specialCat(rec) {
  const s = String(rec || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (/DNS/.test(s)) return 3;
  if (/DNF/.test(s) || /NOTIME/.test(s) || s === 'NT') return 1;
  return 2;                                  // PEN / PRN / DSQ
}
const CAT_CODE = { 1:'DNF', 2:'PEN', 3:'DNS' };

// 라운드 순위 계산 → key → { rk, sort, code }
function rankRound(heats) {
  const map = new Map();
  let roundMax = 0;

  heats.forEach(h => {
    const done = h.athletes
      .filter(a => a.r && !isSpecial(a.r) && parseRecord(a.r) !== Infinity)
      .sort((x, y) => parseRecord(x.r) - parseRecord(y.r));
    done.forEach((a, i) => map.set(akey(a), { rk:i+1, sort:i+1, code:null }));

    // 조별 순위를 받는 분류: DNF / no time
    const inHeat = h.athletes
      .filter(a => a.r && !map.has(akey(a)) && specialCat(a.r) === 1)
      .map(a => ({ a }));

    let last = done.length;
    if (inHeat.length) {
      last = done.length + 1;                        // 같은 조 DNF 는 서로 동률
      inHeat.forEach(e => map.set(akey(e.a), {
        rk: last, sort: last, code: hasYC(e.a.r) ? 'YC' : 'DNF',
      }));
    }
    if (last > roundMax) roundMax = last;
  });

  // 라운드 전체 마지막 순위를 받는 분류: PEN → DNS
  const rest = [];
  heats.forEach(h => h.athletes.forEach(a => {
    if (a.r && !map.has(akey(a))) rest.push({ a, cat: specialCat(a.r) });
  }));
  const cats = [...new Set(rest.map(e => e.cat))].sort((x, y) => x - y);
  rest.forEach(e => {
    const r = roundMax + cats.indexOf(e.cat) + 1;
    map.set(akey(e.a), { rk:r, sort:r, code: hasYC(e.a.r) ? 'YC' : CAT_CODE[e.cat] });
  });

  return map;
}

        const pl = (c, dp) => (c._pl && c._pl[dp] !== undefined ? c._pl[dp] : Infinity);
        for (let dp = FINAL_DEPTH - 1; dp >= 1; dp--) {
          const r = cmpNum(pl(x, dp), pl(y, dp));
          if (r) return r;
        }
        return cmpNum(x._best === undefined ? Infinity : x._best,
                      y._best === undefined ? Infinity : y._best);
      };

      const ordered = pool.sort((a, b) => cmp(a, b) || a.name.localeCompare(b.name, 'ko'));

      let rank = 0, prev = null;
      ordered.forEach((r, i) => {
        if (prev === null || cmp(prev, r) !== 0) rank = i + 1;
        r.d[dist].rk = rank;
        prev = r;
      });

      ordered.forEach(r => {
        const c = r.d[dist];
        if (c._yc) return;                            // 기록 무효 → 무득점
        if (c.rk <= TOP_LIMIT) { c.fa = FA_POINTS[c.rk - 1]; r.fp += FA_POINTS[c.rk - 1]; }
      });

      // 미출전자는 출전자 다음 순위(공동 최하위)
      const last = ordered.length + 1;
      g.ath.forEach(r => { if (!r.d[dist]) r.d[dist] = { rk:last, _dns:true, _disp:{} }; });
    });

    g.ath.forEach(r => {
      let sum = 0, n = 0;
      Object.values(r.d).forEach(c => { if (typeof c.rk === 'number') { sum += c.rk; n++; } });
      r.cdr = n ? sum : null;
    });
  });

  return G;
}

// ── 렌더 ────────────────────────────────────────────────────
function cellHtml(v, cls) {
  const pen = typeof v === 'string' && v !== '';
  return `<td class="${cls}${pen ? ' pen' : ''}">${v === undefined || v === null ? '' : v}</td>`;
}


// TOTAL 동점 처리
//  FP 내림차순 → CDR 오름차순
//  → 종목별 RK 를 좋은 순으로 나열해 차례대로 비교(최고 순위 → 그다음 순위 …)
//  → 그래도 같으면 대회 프로그램상 가장 긴 거리의 best time → 이름순
function rankVector(r, dists) {
  return dists
    .map(d => (r.d[d] && typeof r.d[d].rk === 'number') ? r.d[d].rk : Infinity)
    .sort((x, y) => x - y);
}
function longestDist(dists) {
  return dists.slice().sort((a, b) => parseInt(b, 10) - parseInt(a, 10))[0];
}
function cmpTotal(a, b, dists, longest) {
  let r = cmpNum(b.fp, a.fp);
  if (r) return r;
  r = cmpNum(a.cdr === null ? Infinity : a.cdr, b.cdr === null ? Infinity : b.cdr);
  if (r) return r;

  const va = rankVector(a, dists), vb = rankVector(b, dists);
  for (let i = 0; i < Math.max(va.length, vb.length); i++) {
    r = cmpNum(va[i] === undefined ? Infinity : va[i], vb[i] === undefined ? Infinity : vb[i]);
    if (r) return r;
  }

  const bt = x => (x.d[longest] && x.d[longest]._best !== undefined) ? x.d[longest]._best : Infinity;
  r = cmpNum(bt(a), bt(b));
  if (r) return r;

  return a.name.localeCompare(b.name, 'ko');
}

function renderMaster() {
  const G = buildMaster(DATA);
  let html = `
    <div class="day-header">
      <div class="day-dot"></div>
      <div class="day-title">마스터 컨트롤 시트</div>
      <div class="day-date">TOTAL 순위 기준</div>
    </div>
`;

  DATA.grpOrder.forEach(grp => {
    const g = G[grp];
    if (!g || !g.ath.size) return;
    const dists = DATA.distOrder[grp].filter(d => g.dists[d]);

    const subs = {};
    dists.forEach(d => {
      const s = [];
      [1,2,3].forEach(dep => { if (g.dists[d].rounds[dep]) s.push(dep); });
      subs[d] = s;
    });

    const longest = longestDist(dists);
    const rows = [...g.ath.values()].sort((a, b) => cmpTotal(a, b, dists, longest));

    let h1 = `<th class="dist-head c-no">&nbsp;</th><th class="dist-head c-name">Distance</th><th class="dist-head">&nbsp;</th>`;
    dists.forEach(d => { h1 += `<th class="dist-head" colspan="${subs[d].length + 2}">${d.toLowerCase()}</th>`; });
    h1 += `<th class="dist-head" colspan="3">TOTAL</th>`;

    let h2 = `<th class="c-no">No</th><th class="c-name">Name</th><th>소속</th>`;
    dists.forEach(d => {
      subs[d].forEach(dep => { h2 += `<th>${ROUND_ABBR[dep]}</th>`; });
      h2 += `<th>FA</th><th>RK</th>`;
    });
    h2 += `<th>FP</th><th>CDR</th><th>RK</th>`;

    let body = '';
    rows.forEach((r,i) => {
      body += `<tr data-name="${r.name}">
        <td class="c-no">${i+1}</td>
        <td class="name c-name${SEONGNAM_TEAM.has(r.name)?' seongnam':''}">${r.name}</td>
        <td class="org">${r.org}</td>`;
      dists.forEach(d => {
        const c = r.d[d] || {};
        subs[d].forEach(dep => { body += cellHtml(c._disp ? c._disp[dep] : '', ''); });
        body += cellHtml(c.fa, 'fa') + cellHtml(c.rk, 'rk' + (c._dns ? ' dns' : ''));
      });
      body += `<td class="fp">${r.fp||''}</td><td>${r.cdr===null?'':r.cdr}</td><td class="trk">${r.cdr===null?'':i+1}</td></tr>`;
    });

    html += `
      <div class="master-block" data-grp="${grp}">
        <div class="master-block-title">${grp}<span class="cnt">${rows.length}명</span></div>
        <div class="table-scroll">
          <table class="master">
            <thead><tr>${h1}</tr><tr>${h2}</tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>
      </div>`;
  });

  html += `<div class="master-note">
    · 배점: 종목별 랭킹 1~8위에게 34 · 21 · 13 · 8 · 5 · 3 · 2 · 1점<br>
    · 종목 최종순위: <b>Final A → Final B → 결승 미진출자</b>.
      Final B 가 있으면 A · B 는 그 경기 결과만 사용합니다<br>
    · 미진출자: 탈락 라운드가 깊은 순 → 그 라운드 finish order →
      이전 라운드 순위 → 해당 종목 best time → 동순위<br>
    · 한 경기 내 순서: 정상 완주 → <b>DNF(no time)</b> → <b>PEN</b> → <b>DNS</b><br>
    · 라운드 순위: 완주자는 조 순위, DNF/no time 은 같은 조 완주자 다음 순위,
      PEN · DNS 는 라운드 전체의 마지막 순위<br>
    · <b>YC</b>(한 경기 PEN 2회) 는 해당 종목 전 기록이 무효가 되어 DNS 상당의 최하위·무득점<br>
    · 해당 종목 미출전자는 출전자 다음 순위(공동 최하위)로 CDR 에 반영합니다<br>
    · PR = 예선, QF = 준준결승, SF = 준결승 순위 · FA = 획득 점수 · RK = 종목 랭킹<br>
    · CDR = 종목별 RK 합계 · TOTAL RK 는 FP 내림차순, 동점 시 CDR 오름차순<br>
    · FP · CDR 까지 같으면 <b>각 종목 최고 순위 → 그다음 순위 …</b> 순으로 비교하고,
      그래도 같으면 <b>가장 긴 거리의 best time</b> 으로 가립니다
  </div>`;

  const el = document.getElementById('master');
  el.className = 'day-section';
  el.innerHTML = html;
  applyFilters();
  if (searchInput.value.trim()) handleSearch();
}


// ── 필터 ────────────────────────────────────────────────────
let grpFilter = 'all';
function buildTabs() {
  const tabs = [['all','전체 종별']].concat(DATA.grpOrder.map(g => [g, DATA.short[g] || g]));
  document.getElementById('groupTabs').innerHTML = tabs.map(([k,l]) =>
    `<button class="group-tab${k==='all'?' active':''}" data-grp="${k}" onclick="filterGrp('${k}',this)">${l}</button>`
  ).join('');
}
function filterGrp(g, btn) {
  grpFilter = g;
  document.querySelectorAll('.group-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}
function applyFilters() {
  document.querySelectorAll('.master-block').forEach(b => {
    b.classList.toggle('hidden', !(grpFilter === 'all' || b.dataset.grp === grpFilter));
  });
}

// ── 검색 ────────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const searchCount = document.getElementById('searchCount');
searchInput.addEventListener('input', handleSearch);

function handleSearch() {
  const q = searchInput.value.trim();
  document.querySelectorAll('table.master tbody tr').forEach(tr => tr.classList.remove('hit'));
  if (!q) { searchCount.textContent = ''; return; }
  let n = 0, first = null;
  document.querySelectorAll('table.master tbody tr').forEach(tr => {
    if (tr.dataset.name.includes(q)) { tr.classList.add('hit'); n++; if (!first) first = tr; }
  });
  searchCount.textContent = n ? `${n}건` : '없음';
  if (first) {
    const blk = first.closest('.master-block');
    if (blk.classList.contains('hidden')) {
      grpFilter = 'all';
      document.querySelectorAll('.group-tab').forEach(b => b.classList.toggle('active', b.dataset.grp === 'all'));
      applyFilters();
    }
    first.scrollIntoView({ behavior:'smooth', block:'center' });
  }
}

buildTabs();
renderMaster();
</script>
</body>
</html>
