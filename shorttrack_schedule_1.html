<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제40회 전국남녀 종별종합 쇼트트랙 선수권대회</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ice: #e8f4fb;
    --deep: #0a1628;
    --blue: #1a6fa8;
    --accent: #00c9ff;
    --gold: #f5c842;
    --silver: #b8c4cc;
    --track: #0d3b5c;
    --card: #0f2540;
    --border: #1e3f62;
    --text: #cde0f0;
    --muted: #6a8fa8;
    --day1: #1a6fa8;
    --day2: #0e8a6e;
    --day3: #7c3fa8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--deep);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background rink effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 50% 20%, rgba(0,201,255,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 60% 60% at 80% 80%, rgba(26,111,168,0.08) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 16px 60px; }

  /* Header */
  header {
    text-align: center;
    padding: 48px 0 36px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 32px;
  }

  .header-badge {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--blue));
    color: white;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  header h1 {
    font-family: 'Black Han Sans', sans-serif;
    font-size: clamp(22px, 4vw, 36px);
    letter-spacing: -0.5px;
    line-height: 1.3;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }

  .header-sub {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 1px;
  }

  .date-chips {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .date-chip {
    padding: 6px 18px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .date-chip.d1 { background: rgba(26,111,168,0.2); border: 1px solid var(--day1); color: #7ec8f0; }
  .date-chip.d2 { background: rgba(14,138,110,0.2); border: 1px solid var(--day2); color: #7ef0d4; }
  .date-chip.d3 { background: rgba(124,63,168,0.2); border: 1px solid var(--day3); color: #d0a8f0; }

  /* Search */
  .search-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,22,40,0.95);
    backdrop-filter: blur(12px);
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  .search-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .search-box {
    flex: 1;
    position: relative;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 16px;
  }

  #searchInput {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px 11px 40px;
    color: white;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }

  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,201,255,0.12);
  }

  #searchInput::placeholder { color: var(--muted); }

  #searchCount {
    font-size: 12px;
    color: var(--accent);
    white-space: nowrap;
    font-weight: 600;
    min-width: 60px;
    text-align: right;
  }

  /* Search results dropdown */
  #searchResults {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 200;
    display: none;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
  }

  .search-result-item {
    padding: 10px 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(30,63,98,0.5);
    transition: background 0.15s;
  }

  .search-result-item:hover { background: rgba(0,201,255,0.08); }
  .search-result-item:last-child { border-bottom: none; }

  .result-name { font-weight: 600; font-size: 14px; color: white; }
  .result-meta { font-size: 12px; color: var(--muted); }

  /* Day tabs */
  .day-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .day-tab {
    padding: 9px 22px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .day-tab.d1 { color: #7ec8f0; border-color: var(--day1); background: rgba(26,111,168,0.1); }
  .day-tab.d1.active, .day-tab.d1:hover { background: var(--day1); color: white; }
  .day-tab.d2 { color: #7ef0d4; border-color: var(--day2); background: rgba(14,138,110,0.1); }
  .day-tab.d2.active, .day-tab.d2:hover { background: var(--day2); color: white; }
  .day-tab.d3 { color: #d0a8f0; border-color: var(--day3); background: rgba(124,63,168,0.1); }
  .day-tab.d3.active, .day-tab.d3:hover { background: var(--day3); color: white; }
  .day-tab.all { color: var(--text); border-color: var(--border); background: rgba(255,255,255,0.05); }
  .day-tab.all.active, .day-tab.all:hover { background: rgba(255,255,255,0.12); color: white; }

  /* Day section */
  .day-section { margin-bottom: 40px; }

  .day-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .day-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .d1 .day-dot { background: var(--day1); box-shadow: 0 0 10px var(--day1); }
  .d2 .day-dot { background: var(--day2); box-shadow: 0 0 10px var(--day2); }
  .d3 .day-dot { background: var(--day3); box-shadow: 0 0 10px var(--day3); }

  .day-title {
    font-family: 'Black Han Sans', sans-serif;
    font-size: 20px;
    letter-spacing: 0.5px;
  }

  .day-date {
    font-size: 12px;
    color: var(--muted);
    margin-left: auto;
    letter-spacing: 1px;
  }

  /* Time group */
  .time-group {
    margin-bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .time-group:hover { box-shadow: 0 4px 20px rgba(0,201,255,0.06); }

  .time-group-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    background: var(--card);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }

  .time-group-header:hover { background: rgba(255,255,255,0.04); }

  .time-badge {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    letter-spacing: 0.5px;
    flex-shrink: 0;
  }
  .day-section.d1 .time-badge { background: rgba(26,111,168,0.25); color: #7ec8f0; }
  .day-section.d2 .time-badge { background: rgba(14,138,110,0.25); color: #7ef0d4; }
  .day-section.d3 .time-badge { background: rgba(124,63,168,0.25); color: #d0a8f0; }

  .event-name {
    font-size: 14px;
    font-weight: 600;
    color: white;
    flex: 1;
  }

  .event-meta {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }

  .toggle-icon {
    color: var(--muted);
    font-size: 16px;
    transition: transform 0.25s;
    flex-shrink: 0;
  }

  .time-group.open .toggle-icon { transform: rotate(180deg); }

  .time-group-body {
    display: none;
    padding: 0 18px 16px;
    background: rgba(10,22,40,0.5);
    border-top: 1px solid var(--border);
  }

  .time-group.open .time-group-body { display: block; }

  /* Heat (조) */
  .heats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 12px;
    margin-top: 14px;
  }

  .heat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .heat-card:hover { border-color: var(--accent); box-shadow: 0 2px 12px rgba(0,201,255,0.1); }

  .heat-card.highlight {
    border-color: var(--gold) !important;
    box-shadow: 0 0 0 2px rgba(245,200,66,0.25), 0 4px 20px rgba(245,200,66,0.15) !important;
  }

  .heat-title {
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .day-section.d1 .heat-title { background: rgba(26,111,168,0.2); color: #7ec8f0; }
  .day-section.d2 .heat-title { background: rgba(14,138,110,0.2); color: #7ef0d4; }
  .day-section.d3 .heat-title { background: rgba(124,63,168,0.2); color: #d0a8f0; }

  .heat-athletes { list-style: none; padding: 6px 0; }

  .heat-athlete {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    font-size: 13px;
    transition: background 0.15s;
    cursor: default;
  }

  .heat-athlete:hover { background: rgba(255,255,255,0.04); }

  .heat-athlete.highlighted {
    background: rgba(245,200,66,0.12);
    border-radius: 5px;
  }

  .lane-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1.5px solid rgba(255,255,255,0.2);
  }

  .athlete-name {
    font-weight: 500;
    color: #e0eefa;
    flex: 1;
  }

  .athlete-org {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    max-width: 110px;
    line-height: 1.3;
  }

  /* Lane colors */
  .lane-white { background: #f0f0f0; }
  .lane-yellow { background: #f5c842; }
  .lane-red { background: #e63946; }
  .lane-blue { background: #4895ef; }
  .lane-violet { background: #9b5de5; }
  .lane-black { background: #3a3a4a; }
  .lane-orange { background: #f4823a; }

  /* Final/only athlete events */
  .solo-athlete {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    margin-top: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
  }

  .solo-athlete .athlete-name { font-weight: 600; color: white; font-size: 14px; }

  /* TBD placeholder */
  .tbd-note {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 16px;
    font-style: italic;
  }

  /* highlight anchor */
  .highlight-target {
    scroll-margin-top: 80px;
  }

  /* Section collapse-all */
  .section-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .ctrl-btn {
    padding: 6px 14px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--muted);
    font-family: 'Noto Sans KR', sans-serif;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--deep); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--blue); }

  /* hidden */
  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .heats-grid { grid-template-columns: 1fr; }
    header h1 { font-size: 20px; }
    .time-group-header { padding: 11px 14px; }
  }
</style>
</head>

// Build athlete index for search
const athleteIndex = [];
let eventUidCounter = 0;

scheduleData.forEach(day => {
  day.events.forEach(event => {
    const eid = 'event-' + (eventUidCounter++);
    event._uid = eid;
    event.heats.forEach((heat, hi) => {
      const hid = eid + '-h' + hi;
      heat._uid = hid;
      heat.athletes.forEach(a => {
        if (a.name) {
          athleteIndex.push({
            name: a.name,
            org: a.org,
            eventName: event.name,
            heatName: heat.heatName,
            day: day.dayLabel,
            eventUid: eid,
            heatUid: hid,
          });
        }
      });
    });
  });
});

function renderSchedule() {
  const container = document.getElementById('schedule');
  container.innerHTML = '';

  scheduleData.forEach(day => {
    const section = document.createElement('div');
    section.className = `day-section ${day.day}`;
    section.id = day.day;

    section.innerHTML = `
      <div class="day-header">
        <div class="day-dot"></div>
        <div class="day-title">${day.dayLabel}</div>
        <div class="day-date">${day.dayDate}</div>
      </div>
      <div class="section-controls">
        <button class="ctrl-btn" onclick="toggleAll('${day.day}', true)">▼ 모두 펼치기</button>
        <button class="ctrl-btn" onclick="toggleAll('${day.day}', false)">▲ 모두 접기</button>
      </div>
    `;

    day.events.forEach(event => {
      const tg = document.createElement('div');
      tg.className = 'time-group highlight-target';
      tg.id = event._uid;

      const hasData = event.heats.some(h => h.athletes.length > 0);
      const roundLabel = event.name.includes('결승') && !event.name.includes('준') ? '🏆 결승' :
                         event.name.includes('준결승') && !event.name.includes('준준') ? '🥈 준결승' :
                         event.name.includes('준준결승') ? '🔹 준준결승' : '🔸 예선';

      tg.innerHTML = `
        <div class="time-group-header" onclick="toggleGroup(this.parentElement)">
          <span class="time-badge">${event.time}</span>
          <span class="event-name">${event.name}</span>
          <span class="event-meta">${roundLabel} · ${event.meta}</span>
          <span class="toggle-icon">▼</span>
        </div>
        <div class="time-group-body">
          ${renderHeats(event.heats, hasData)}
        </div>
      `;
      section.appendChild(tg);
    });

    container.appendChild(section);
  });
}

function renderHeats(heats, hasData) {
  if (!hasData) {
    // all heats empty
    const allEmpty = heats.every(h => h.athletes.length === 0);
    if (allEmpty) return `<div class="tbd-note">✦ 해당 조편성은 이전 라운드 결과에 따라 결정됩니다</div>`;
  }

  let html = '<div class="heats-grid">';
  heats.forEach(heat => {
    html += `<div class="heat-card" id="${heat._uid}">
      <div class="heat-title">${heat.heatName}</div>`;
    if (heat.athletes.length === 0) {
      html += `<div class="tbd-note">결과에 따라 결정</div>`;
    } else {
      html += `<ul class="heat-athletes">`;
      heat.athletes.forEach(a => {
        const lc = LANE_COLORS[a.lane] || { cls: 'lane-white', label: a.lane };
        html += `<li class="heat-athlete" data-name="${a.name}">
          <span class="lane-dot ${lc.cls}" title="${lc.label}"></span>
          <span class="athlete-name">${a.name}</span>
          <span class="athlete-org">${a.org}</span>
        </li>`;
      });
      html += `</ul>`;
    }
    html += `</div>`;
  });
  html += '</div>';
  return html;
}

// ============================================================
// TOGGLE
// ============================================================
function toggleGroup(el) {
  el.classList.toggle('open');
}

function toggleAll(dayId, open) {
  const section = document.getElementById(dayId);
  if (!section) return;
  section.querySelectorAll('.time-group').forEach(tg => {
    if (open) tg.classList.add('open');
    else tg.classList.remove('open');
  });
}

// ============================================================
// DAY FILTER
// ============================================================
function filterDay(day, btn) {
  document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.querySelectorAll('.day-section').forEach(s => {
    if (day === 'all' || s.id === day) {
      s.classList.remove('hidden');
    } else {
      s.classList.add('hidden');
    }
  });
}

// ============================================================
// SEARCH
// ============================================================
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
const searchCount = document.getElementById('searchCount');

searchInput.addEventListener('input', handleSearch);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSearch(); searchInput.blur(); }
});

document.addEventListener('click', e => {
  if (!e.target.closest('.search-box')) closeSearch();
});

function handleSearch() {
  const q = searchInput.value.trim();
  clearHighlights();

  if (!q) {
    closeSearch();
    searchCount.textContent = '';
    return;
  }

  const results = athleteIndex.filter(a => a.name.includes(q));
  searchCount.textContent = results.length ? `${results.length}명` : '없음';

  if (!results.length) {
    searchResults.innerHTML = '<div class="search-result-item"><span class="result-name">검색 결과 없음</span></div>';
    searchResults.style.display = 'block';
    return;
  }

  searchResults.innerHTML = results.slice(0, 20).map((r, i) => `
    <div class="search-result-item" onclick="goToAthlete(${athleteIndex.indexOf(r)})">
      <div>
        <div class="result-name">${r.name}</div>
        <div class="result-meta">${r.day} · ${r.eventName} · ${r.heatName} · ${r.org}</div>
      </div>
    </div>
  `).join('');
  searchResults.style.display = 'block';
}

function goToAthlete(idx) {
  const r = athleteIndex[idx];
  closeSearch();
  clearHighlights();
  searchInput.value = r.name;
  searchCount.textContent = '';

  // Show all days (reset filter)
  document.querySelectorAll('.day-tab').forEach(b => b.classList.remove('active'));
  document.querySelector('.day-tab.all').classList.add('active');
  document.querySelectorAll('.day-section').forEach(s => s.classList.remove('hidden'));

  // Open the event group
  const eventEl = document.getElementById(r.eventUid);
  if (eventEl) {
    eventEl.classList.add('open');
    setTimeout(() => {
      const heatEl = document.getElementById(r.heatUid);
      if (heatEl) {
        heatEl.classList.add('highlight');
        // Highlight athlete row
        heatEl.querySelectorAll('.heat-athlete').forEach(row => {
          if (row.dataset.name === r.name) {
            row.classList.add('highlighted');
          }
        });
      }
      eventEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 50);
  }
}

function clearHighlights() {
  document.querySelectorAll('.heat-card.highlight').forEach(el => el.classList.remove('highlight'));
  document.querySelectorAll('.heat-athlete.highlighted').forEach(el => el.classList.remove('highlighted'));
}

function closeSearch() {
  searchResults.style.display = 'none';
}

// ============================================================
// INIT
// ============================================================
renderSchedule();
</script>
