<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="오목">
<title>오목</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --table:#2a1c13;
  --table-light:#3d2a1c;
  --wood:#dcae62;
  --wood-deep:#b78439;
  --line:#5a3b19;
  --paper:#f1e6d2;
  --muted:#b9a68a;
  --seal:#b3302a;
  --panel-h:150px;
  --panel-w:230px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Gowun Batang",serif;
  color:var(--paper);
  background:
    radial-gradient(ellipse at 50% 45%, var(--table-light) 0%, var(--table) 70%);
  display:grid;
  grid-template-rows:auto 1fr auto;
  height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
}

/* ---------- Board ---------- */
.board-area{display:grid;place-items:center;min-height:0;min-width:0}
.board-wrap{
  width:min(96vw, calc(100dvh - 2 * var(--panel-h) - 24px));
  aspect-ratio:1;
  border-radius:10px;
  background:
    repeating-linear-gradient(93deg, rgba(110,60,15,.07) 0 2px, transparent 2px 11px),
    repeating-linear-gradient(88deg, rgba(255,230,180,.08) 0 1px, transparent 1px 23px),
    linear-gradient(160deg, #e5ba70 0%, var(--wood) 45%, var(--wood-deep) 100%);
  box-shadow:
    0 2px 0 #f0cd8c inset,
    0 -3px 0 rgba(90,50,10,.35) inset,
    0 18px 40px rgba(0,0,0,.55),
    0 4px 10px rgba(0,0,0,.4);
}
svg{display:block;width:100%;height:100%;touch-action:none}
.drop{animation:drop .18s ease-out;transform-box:fill-box;transform-origin:center}
@keyframes drop{from{transform:scale(1.25);opacity:.4}to{transform:scale(1);opacity:1}}
.win-ring{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.45}}

/* ---------- Player panels ---------- */
.panel{
  height:var(--panel-h);
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  padding:16px 28px;
  transition:opacity .25s;
}
.panel.seat-a{transform:rotate(180deg)}
.who{display:flex;align-items:center;gap:16px}
.stone-icon{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:0 3px 6px rgba(0,0,0,.5)}
.stone-icon.black{background:radial-gradient(circle at 35% 30%, #5a5a5a, #121212 60%)}
.stone-icon.white{background:radial-gradient(circle at 35% 30%, #fff, #d6d0c4 75%)}
.status{font-size:30px;font-weight:700;line-height:1.15}
.sub{font-size:16px;color:var(--muted);margin-top:4px}
.panel.waiting .status{color:var(--muted);font-weight:400}
.panel.won .status{color:#f5c26b}
.score{font-size:18px;color:var(--muted);text-align:center;min-width:56px}
.score b{display:block;font-size:34px;color:var(--paper);line-height:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
button{
  font-family:inherit;font-size:18px;
  color:var(--paper);background:rgba(255,240,210,.08);
  border:1.5px solid rgba(241,230,210,.28);
  border-radius:999px;padding:12px 20px;min-height:48px;cursor:pointer;
}
button:active{background:rgba(255,240,210,.2)}
button:disabled{opacity:.35}
button.primary{background:var(--seal);border-color:var(--seal);color:#fff}
button.warn{border-color:#e08a5a;color:#ffcfa8}
button:focus-visible{outline:3px solid #f5c26b;outline-offset:2px}
.chip{font-size:15px;padding:8px 14px;min-height:40px}

/* ---------- Landscape ---------- */
@media (orientation:landscape){
  body{grid-template-rows:1fr;grid-template-columns:1fr auto 1fr}
  .board-wrap{width:min(94dvh, calc(100vw - 2 * var(--panel-w) - 24px))}
  .panel{height:auto;flex-direction:column;justify-content:center;gap:22px;padding:20px 16px;text-align:center}
  .who{flex-direction:column;gap:10px}
  .actions{flex-direction:column;align-items:stretch;justify-content:center}
}
@media (prefers-reduced-motion:reduce){.drop,.win-ring{animation:none}}
</style>
</head>
<body>

<section class="panel seat-a" id="panelA" aria-live="polite">
  <div class="who">
    <div class="stone-icon" data-icon></div>
    <div><div class="status" data-status></div><div class="sub" data-sub></div></div>
  </div>
  <div class="score"><b data-score>0</b>승</div>
  <div class="actions">
    <button data-undo>무르기</button>
    <button data-new>새 판</button>
  </div>
</section>

<main class="board-area">
  <div class="board-wrap"><svg id="board" role="grid" aria-label="오목판"></svg></div>
</main>

<section class="panel seat-b" id="panelB" aria-live="polite">
  <div class="who">
    <div class="stone-icon" data-icon></div>
    <div><div class="status" data-status></div><div class="sub" data-sub></div></div>
  </div>
  <div class="score"><b data-score>0</b>승</div>
  <div class="actions">
    <button data-undo>무르기</button>
    <button data-new>새 판</button>
    <button class="chip" id="confirmToggle"></button>
    <button class="chip" id="soundToggle"></button>
  </div>
</section>

<script>
const N = 15, C = 40, M = 30, S = M * 2 + C * (N - 1);
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('board');
svg.setAttribute('viewBox', `0 0 ${S} ${S}`);
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const pos = i => M + i * C;

svg.innerHTML = `
<defs>
  <radialGradient id="gb" cx="35%" cy="30%" r="70%">
    <stop offset="0" stop-color="#666"/><stop offset=".45" stop-color="#1c1c1c"/><stop offset="1" stop-color="#050505"/>
  </radialGradient>
  <radialGradient id="gw" cx="35%" cy="30%" r="75%">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#ece7dc"/><stop offset="1" stop-color="#bdb6a8"/>
  </radialGradient>
</defs>`;

// grid
const grid = el('g', { stroke: '#5a3b19', 'stroke-width': 1.2, 'stroke-linecap': 'square' }, svg);
for (let i = 0; i < N; i++) {
  el('line', { x1: pos(0), y1: pos(i), x2: pos(N - 1), y2: pos(i) }, grid);
  el('line', { x1: pos(i), y1: pos(0), x2: pos(i), y2: pos(N - 1) }, grid);
}
el('rect', { x: pos(0), y: pos(0), width: C * (N - 1), height: C * (N - 1), fill: 'none', stroke: '#4a3014', 'stroke-width': 2.4 }, svg);
[[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([x, y]) => el('circle', { cx: pos(x), cy: pos(y), r: 4.2, fill: '#4a3014' }, svg));
const gStones = el('g', {}, svg);
const gMarks = el('g', {}, svg);

// ---------- state ----------
const BLACK = 1, WHITE = 2;
let board, moves, turn, over, winLine, ghost, lastWinner;
let seatColor = { A: WHITE, B: BLACK };
const score = { A: 0, B: 0 };
let confirmTap = true, sound = true;
let newConfirm = null;

function reset() {
  board = new Array(N * N).fill(0);
  moves = []; turn = BLACK; over = false; winLine = null; ghost = null; lastWinner = null;
  render(); updatePanels();
}

// ---------- input ----------
svg.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (over) return;
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const x = Math.round((p.x - M) / C), y = Math.round((p.y - M) / C);
  if (x < 0 || y < 0 || x >= N || y >= N) return;
  const idx = y * N + x;
  if (board[idx]) return;
  if (confirmTap && ghost !== idx) { ghost = idx; render(); return; }
  place(idx);
});

function place(idx) {
  board[idx] = turn; moves.push(idx); ghost = null;
  playClick();
  const line = findWin(idx);
  if (line) {
    over = true; winLine = line;
    lastWinner = seatOf(turn); score[lastWinner]++;
  } else if (moves.length === N * N) {
    over = true; lastWinner = 'draw';
  } else {
    turn = turn === BLACK ? WHITE : BLACK;
  }
  render(true); updatePanels();
}

function findWin(idx) {
  const c = board[idx], x0 = idx % N, y0 = Math.floor(idx / N);
  for (const [dx, dy] of [[1,0],[0,1],[1,1],[1,-1]]) {
    const cells = [idx];
    for (const s of [1, -1]) {
      let x = x0 + dx * s, y = y0 + dy * s;
      while (x >= 0 && y >= 0 && x < N && y < N && board[y * N + x] === c) {
        s === 1 ? cells.push(y * N + x) : cells.unshift(y * N + x);
        x += dx * s; y += dy * s;
      }
    }
    if (cells.length >= 5) return cells;
  }
  return null;
}

function undo() {
  if (!moves.length) return;
  const idx = moves.pop();
  if (over && lastWinner && lastWinner !== 'draw') score[lastWinner]--;
  turn = board[idx]; board[idx] = 0;
  over = false; winLine = null; ghost = null; lastWinner = null;
  render(); updatePanels();
}

function newGame(btn) {
  if (moves.length && !over) {
    if (newConfirm !== btn) {
      clearNewConfirm();
      newConfirm = btn; btn.textContent = '정말 새 판?'; btn.classList.add('warn');
      btn._t = setTimeout(clearNewConfirm, 2500);
      return;
    }
  }
  clearNewConfirm();
  if (over) seatColor = { A: seatColor.B, B: seatColor.A }; // 판이 끝나면 흑백 교대
  reset();
}
function clearNewConfirm() {
  if (!newConfirm) return;
  clearTimeout(newConfirm._t); newConfirm.classList.remove('warn'); newConfirm = null; updatePanels();
}

const seatOf = color => seatColor.A === color ? 'A' : 'B';

// ---------- render ----------
function drawStone(idx, color, g, cls, opacity) {
  const x = pos(idx % N), y = pos(Math.floor(idx / N));
  const grp = el('g', cls ? { class: cls } : {}, g);
  if (opacity) grp.setAttribute('opacity', opacity);
  el('circle', { cx: x + 1.5, cy: y + 2.5, r: 18, fill: 'rgba(40,20,0,.38)' }, grp);
  el('circle', { cx: x, cy: y, r: 18.2, fill: color === BLACK ? 'url(#gb)' : 'url(#gw)' }, grp);
}

function render(animateLast) {
  gStones.innerHTML = ''; gMarks.innerHTML = '';
  const last = moves[moves.length - 1];
  for (let i = 0; i < board.length; i++) {
    if (board[i]) drawStone(i, board[i], gStones, animateLast && i === last ? 'drop' : '');
  }
  if (ghost !== null) {
    drawStone(ghost, turn, gStones, '', .5);
    const x = pos(ghost % N), y = pos(Math.floor(ghost / N));
    el('circle', { cx: x, cy: y, r: 22, fill: 'none', stroke: turn === BLACK ? '#1a1a1a' : '#fff', 'stroke-width': 2, 'stroke-dasharray': '4 4' }, gMarks);
  }
  if (last !== undefined && !winLine) {
    el('circle', { cx: pos(last % N), cy: pos(Math.floor(last / N)), r: 4.5, fill: '#c8352d' }, gMarks);
  }
  if (winLine) {
    const a = winLine[0], b = winLine[winLine.length - 1];
    el('line', { x1: pos(a % N), y1: pos(Math.floor(a / N)), x2: pos(b % N), y2: pos(Math.floor(b / N)),
      stroke: '#b3302a', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: .85 }, gMarks);
    winLine.forEach(i => el('circle', { class: 'win-ring', cx: pos(i % N), cy: pos(Math.floor(i / N)), r: 21.5, fill: 'none', stroke: '#b3302a', 'stroke-width': 3 }, gMarks));
  }
}

const colorName = c => c === BLACK ? '흑' : '백';

function updatePanels() {
  for (const seat of ['A', 'B']) {
    const p = document.getElementById('panel' + seat);
    const color = seatColor[seat];
    p.querySelector('[data-icon]').className = 'stone-icon ' + (color === BLACK ? 'black' : 'white');
    p.querySelector('[data-score]').textContent = score[seat];
    let status, sub;
    p.classList.remove('waiting', 'won');
    if (over) {
      const next = colorName(color === BLACK ? WHITE : BLACK);
      sub = `다음 판은 ${next}으로 둡니다`;
      if (lastWinner === 'draw') status = '무승부';
      else if (lastWinner === seat) { status = '이겼습니다!'; p.classList.add('won'); }
      else { status = '졌습니다'; p.classList.add('waiting'); }
    } else {
      const mine = turn === color;
      status = mine ? '내 차례' : '상대 차례';
      if (!mine) p.classList.add('waiting');
      sub = `${colorName(color)}돌` + (mine && confirmTap ? ' · 한 번 더 눌러 확정' : '');
    }
    p.querySelector('[data-status]').textContent = status;
    p.querySelector('[data-sub]').textContent = sub;
    p.querySelector('[data-undo]').disabled = !moves.length;
    const nb = p.querySelector('[data-new]');
    if (nb !== newConfirm) {
      nb.textContent = over ? '한 판 더' : '새 판';
      nb.classList.toggle('primary', over);
    }
  }
  document.getElementById('confirmToggle').textContent = `두 번 눌러 두기 ${confirmTap ? '켬' : '끔'}`;
  document.getElementById('soundToggle').textContent = `소리 ${sound ? '켬' : '끔'}`;
}

// ---------- sound ----------
let actx;
function playClick() {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const len = Math.floor(actx.sampleRate * 0.07);
    const buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 5);
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1600; f.Q.value = 1.4;
    const g = actx.createGain(); g.gain.value = 1.4;
    src.connect(f).connect(g).connect(actx.destination); src.start();
  } catch (e) {}
}

// ---------- wiring ----------
document.querySelectorAll('[data-undo]').forEach(b => b.addEventListener('click', undo));
document.querySelectorAll('[data-new]').forEach(b => b.addEventListener('click', () => newGame(b)));
document.getElementById('confirmToggle').addEventListener('click', () => { confirmTap = !confirmTap; ghost = null; render(); updatePanels(); });
document.getElementById('soundToggle').addEventListener('click', () => { sound = !sound; updatePanels(); });
document.addEventListener('gesturestart', e => e.preventDefault());

reset();
</script>
</body>
</html>
