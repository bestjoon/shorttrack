<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>쇼트트랙 기록 History</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- 선수 데이터 파일 로드 -->
    <script src="players_data_sy.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px 0 rgba(31, 38, 135, 0.25);
        }
        .record-card {
            transition: all 0.2s ease;
        }

            transition: all 0.2s ease;

            background-color: rgba(102, 126, 234, 0.1);
        }
        .event-tab.active {
            background-color: rgba(102, 126, 234, 0.2);
            border-bottom: 2px solid #667eea;
        }
        .upload-area {
            border: 2px dashed #667eea;
            transition: all 0.2s ease;
        }
        .upload-area:hover {
            border-color: #764ba2;
            background-color: rgba(102, 126, 234, 0.05);
        }
        .upload-area.dragover {
            border-color: #764ba2;
            background-color: rgba(102, 126, 234, 0.1);
        }
        
        /* 모바일 최적화 */
        @media (max-width: 768px) {
            body {
                font-size: 14px;
            }
            .glass-effect {
                box-shadow: 0 2px 8px 0 rgba(31, 38, 135, 0.2);
                padding: 1rem !important;
            }
            table {
                font-size: 12px;
            }
            .mobile-compact td, .mobile-compact th {
                padding: 6px 4px !important;
            }
            .mobile-hidden {
                display: none;
            }
            .mobile-text-sm {
                font-size: 11px;
            }
            .mobile-text-xs {
                font-size: 10px;
            }
            /* 모바일에서 버튼 여백 최소화 */
            .mobile-btn-container {
                gap: 0.4rem !important;
            }
        }
        
        /* 스크롤바 스타일링 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(102, 126, 234, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(102, 126, 234, 0.7);
        }
        
        /* 로딩 스피너 */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function parseTime2000M(timeStr) {
            // 2000M 기록에서 포인트 제거하고 시간만 추출
            // 예: "(15)03:53.692" -> "03:53.692"
            if (!timeStr) return null;
            
            const cleanedStr = String(timeStr).replace(/^\(\d+\)/, '');
            return cleanedStr;
        }

        function parseSheetData(jsonData) {
            // 선수 정보 파싱 (행 2-5)
            const playerInfo = {
                '이름': jsonData[2]?.[1] || '',
                '성별': jsonData[2]?.[3] || '',
                '출생년도': jsonData[3]?.[1] || '',
                '종별': jsonData[3]?.[3] || '',
                '소속팀': jsonData[4]?.[1] || '',
                '시도': jsonData[4]?.[3] || '',
                '최종등록년도': jsonData[5]?.[1] || '',
                '등록구분': jsonData[5]?.[3] || ''
            };

            // 대회 기록 파싱 (행 10부터 시작)
            const competitions = [];
            let currentComp = null;
            let records = [];

            for (let i = 10; i < jsonData.length; i++) {
                const row = jsonData[i];
                if (!row || row.length === 0) continue;
                
                // 첫 번째 컬럼의 값을 정규화 (문자열화, 공백 제거)
                const firstCol = row[0];
                const secondCol = row[1];
                
                // 첫 번째 컬럼이 날짜(8자리 숫자) 형식인지 확인
                const isDateFormat = firstCol && String(firstCol).match(/^\d{8}$/);
                
                // 대회명 행 (첫 번째 컬럼에만 값이 있고 두 번째 컬럼이 없는 경우)
                if (firstCol && !secondCol && !isDateFormat) {
                    if (currentComp && records.length > 0) {
                        competitions.push({
                            name: currentComp,
                            records: records
                        });
                    }
                    currentComp = String(firstCol).trim();
                    records = [];
                }
                // 기록 행 (일자가 8자리 숫자인 경우)
                else if (isDateFormat) {
                    const dateNum = parseInt(String(firstCol));
                    if (dateNum > 20000000) {
                        const record = {
                            '일자': String(firstCol),
                            '종별': row[1] ? String(row[1]).trim() : '',
                            '세부종목': row[2] ? String(row[2]).trim() : '',
                            '라운드': row[3] ? String(row[3]).trim() : '',
                            '소속': row[4] ? String(row[4]).trim() : '',
                            '기록': row[5] ? String(row[5]).trim() : '',
                            '순위': row[6] !== undefined && row[6] !== null && row[6] !== '' ? parseInt(row[6]) : ''
                        };
                        records.push(record);
                    }
                }
            }

            // 마지막 대회 추가
            if (currentComp && records.length > 0) {
                competitions.push({
                    name: currentComp,
                    records: records
                });
            }

            // 연도별 최고 기록 계산
            const yearlyBest = {};
            const allEvents = new Set();

            const timeToSeconds = (timeStr) => {
                if (!timeStr || timeStr === '-' || timeStr === '') return null;
                
                // 2000M 포인트 제거: "(15)03:53.692" -> "03:53.692"
                const cleanedStr = parseTime2000M(timeStr).trim();
                
                // 다양한 시간 형식 처리
                // 형식 1: "00:01:23.456" 또는 "00:01:23.456000"
                let match = cleanedStr.match(/(\d{1,2}):(\d{2}):(\d{2})\.?(\d*)/);
                if (match) {
                    const hours = parseInt(match[1]) || 0;
                    const minutes = parseInt(match[2]) || 0;
                    const seconds = parseInt(match[3]) || 0;
                    const millisStr = match[4] || '0';
                    const milliseconds = parseInt(millisStr.substring(0, 3).padEnd(3, '0'));
                    return hours * 3600 + minutes * 60 + seconds + milliseconds / 1000;
                }
                
                // 형식 2: "01:23.456" (분:초.밀리초)
                match = cleanedStr.match(/^(\d{1,2}):(\d{2})\.(\d+)$/);
                if (match) {
                    const minutes = parseInt(match[1]) || 0;
                    const seconds = parseInt(match[2]) || 0;
                    const millisStr = match[3] || '0';
                    const milliseconds = parseInt(millisStr.substring(0, 3).padEnd(3, '0'));
                    return minutes * 60 + seconds + milliseconds / 1000;
                }
                
                // 형식 3: "23.456" (초.밀리초)
                match = cleanedStr.match(/^(\d{1,2})\.(\d+)$/);
                if (match) {
                    const seconds = parseInt(match[1]) || 0;
                    const millisStr = match[2] || '0';
                    const milliseconds = parseInt(millisStr.substring(0, 3).padEnd(3, '0'));
                    return seconds + milliseconds / 1000;
                }
                
                return null;
            };

            competitions.forEach(comp => {
                comp.records.forEach(record => {
                    const dateStr = record['일자'];
                    if (dateStr && dateStr.length >= 8) {
                        const year = dateStr.substring(0, 4);
                        const event = String(record['세부종목']).toUpperCase();
                        const timeSeconds = timeToSeconds(record['기록']);
                        
                        if (timeSeconds) {
                            allEvents.add(event);
                            
                            if (!yearlyBest[year]) {
                                yearlyBest[year] = {};
                            }
                            
                            if (!yearlyBest[year][event] || timeSeconds < yearlyBest[year][event].time) {
                                yearlyBest[year][event] = {
                                    time: timeSeconds,
                                    time_str: record['기록'],
                                    competition: comp.name,
                                    date: dateStr,
                                    rank: record['순위']
                                };
                            }
                        }
                    }
                });
            });

            return {
                player_info: playerInfo,
                yearly_best: yearlyBest,
                competitions: competitions,
                events: Array.from(allEvents).sort()
            };
        }

        function parseExcelFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        console.log('Sheet names:', workbook.SheetNames);
                        
                        const allPlayers = {};
                        
                        // 모든 시트 읽기
                        workbook.SheetNames.forEach(sheetName => {
                            const worksheet = workbook.Sheets[sheetName];
                            
                            // 셀을 직접 읽어서 포맷 유지
                            const range = XLSX.utils.decode_range(worksheet['!ref']);
                            const jsonData = [];
                            
                            for (let R = range.s.r; R <= range.e.r; ++R) {
                                const row = [];
                                for (let C = range.s.c; C <= range.e.c; ++C) {
                                    const cellAddress = XLSX.utils.encode_cell({ r: R, c: C });
                                    const cell = worksheet[cellAddress];
                                    
                                    if (cell && cell.v !== undefined) {
                                        // 기록 컬럼(5번 컬럼) 특별 처리
                                        if (C === 5) {
                                            if (typeof cell.v === 'string') {
                                                // 문자열인 경우 (2000M 포인트 기록 등)
                                                row[C] = cell.v;
                                            } else if (typeof cell.v === 'number' && cell.v < 1) {
                                                // Excel의 시간 값 (하루의 비율로 저장됨)
                                                const totalSeconds = cell.v * 86400;
                                                const hours = Math.floor(totalSeconds / 3600);
                                                const minutes = Math.floor((totalSeconds % 3600) / 60);
                                                const seconds = Math.floor(totalSeconds % 60);
                                                const milliseconds = Math.round((totalSeconds % 1) * 1000);
                                                
                                                // 시간 문자열 생성
                                                row[C] = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}000`;
                                            } else if (cell.w && cell.w.includes(':')) {
                                                // 이미 시간 형식으로 포맷된 경우
                                                row[C] = cell.w;
                                            } else if (cell.w && /^\d+\.\d+$/.test(cell.w)) {
                                                // "0138.6" 같은 형식 처리
                                                const parts = cell.w.match(/^(\d+)(\d{2})\.(\d+)$/);
                                                if (parts) {
                                                    const minutes = parseInt(parts[1]);
                                                    const seconds = parseInt(parts[2]);
                                                    const decimal = parts[3];
                                                    row[C] = `00:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${decimal.padEnd(3, '0')}000`;
                                                } else {
                                                    // 일반적인 초.밀리초 형식
                                                    const totalSeconds = parseFloat(cell.w);
                                                    const minutes = Math.floor(totalSeconds / 60);
                                                    const seconds = Math.floor(totalSeconds % 60);
                                                    const milliseconds = Math.round((totalSeconds % 1) * 1000);
                                                    row[C] = `00:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(milliseconds).padStart(3, '0')}000`;
                                                }
                                            } else {
                                                row[C] = cell.w || cell.v;
                                            }
                                        } else {
                                            // 다른 컬럼들 - 값을 그대로 사용
                                            row[C] = cell.w !== undefined ? cell.w : cell.v;
                                        }
                                    } else {
                                        row[C] = null;
                                    }
                                }
                                jsonData.push(row);
                            }
                            
                            console.log('Sheet data sample:', jsonData.slice(0, 15));
                            
                            const parsedData = parseSheetData(jsonData);
                            parsedData.sheetName = sheetName;
                            
                            // 이름이 있는 경우만 추가
                            const playerName = parsedData.player_info['이름'];
                            if (playerName && String(playerName).trim()) {
                                allPlayers[String(playerName).trim()] = parsedData;
                                console.log('Added player:', playerName, parsedData);
                            } else {
                                console.warn('No player name found in sheet:', sheetName);
                            }
                        });
                        
                        if (Object.keys(allPlayers).length === 0) {
                            reject(new Error('엑셀 파일에서 선수 데이터를 찾을 수 없습니다. 파일 형식을 확인해주세요.'));
                        } else {
                            resolve(allPlayers);
                        }
                    } catch (error) {
                        console.error('Error parsing Excel:', error);
                        reject(new Error(`파일 처리 중 오류: ${error.message}`));
                    }
                };
                reader.onerror = () => {
                    reject(new Error('파일 읽기 실패'));
                };
                reader.readAsArrayBuffer(file);
            });
        }

        function App() {
            const [playersData, setPlayersData] = useState(null);
            const [selectedPlayer, setSelectedPlayer] = useState(null);
            const [selectedEvent, setSelectedEvent] = useState('ALL');
            const [selectedYear, setSelectedYear] = useState('ALL');
            const [selectedRegion, setSelectedRegion] = useState('ALL');
            const [selectedBirthYears, setSelectedBirthYears] = useState([]); // 배열로 변경 (복수 선택)
            const [selectedGender, setSelectedGender] = useState('여'); // 기본값을 "여"로 설정
            const [loading, setLoading] = useState(true);
            const [uploadStatus, setUploadStatus] = useState('');
            const [dragOver, setDragOver] = useState(false);
            const [dataSource, setDataSource] = useState('default'); // 'default' or 'uploaded'
            const [originalDefaultData, setOriginalDefaultData] = useState(null);
            const [showAllRounds, setShowAllRounds] = useState(false); // 전체 라운드 표시 여부

            // 초기 데이터 로드
            useEffect(() => {
                function loadDefaultData() {
                    // 전역 변수에서 데이터 확인
                    if (typeof defaultPlayersData !== 'undefined') {
                        setOriginalDefaultData(defaultPlayersData);
                        setPlayersData(defaultPlayersData);
                        
                        // 첫 번째 선수 자동 선택
                        const firstPlayer = Object.keys(defaultPlayersData)[1];    // 두번째 선수가 선택되도록 변경
                        if (firstPlayer) {
                            setSelectedPlayer(firstPlayer);
                        }
                        setDataSource('default');
                        setLoading(false);
                        setUploadStatus('');
                    } else {
                        // 데이터가 아직 로드되지 않은 경우 이벤트 리스너 추가
                        const handleDataLoaded = () => {
                            if (typeof defaultPlayersData !== 'undefined') {
                                setOriginalDefaultData(defaultPlayersData);
                                setPlayersData(defaultPlayersData);
                                
                                const firstPlayer = Object.keys(defaultPlayersData)[0];
                                if (firstPlayer) {
                                    setSelectedPlayer(firstPlayer);
                                }
                                setDataSource('default');
                                setLoading(false);
                                setUploadStatus('');
                            }
                        };
                        
                        window.addEventListener('playersDataLoaded', handleDataLoaded);
                        
                        // 3초 후에도 데이터가 없으면 에러 메시지 표시
                        setTimeout(() => {
                            if (loading) {
                                setUploadStatus('기본 데이터 파일(players_data_sy.js)을 찾을 수 없습니다. 엑셀 파일을 업로드해주세요.');
                                setLoading(false);
                            }
                        }, 3000);
                        
                        return () => {
                            window.removeEventListener('playersDataLoaded', handleDataLoaded);
                        };
                    }
                }
                
                loadDefaultData();
            }, []);

            const handleFileInput = async (e) => {
                const file = e.target.files[0];
                if (file) {
                    await handleFile(file);
                }
            };

            const handleFile = async (file) => {
                if (!file.name.match(/\.(xlsx|xls)$/)) {
                    setUploadStatus('엑셀 파일(.xlsx, .xls)만 업로드 가능합니다.');
                    return;
                }

                setLoading(true);
                setUploadStatus('파일 처리 중...');
                
                try {
                    const parsedData = await parseExcelFile(file);
                    setPlayersData(parsedData);
                    setDataSource('uploaded');
                    
                    const firstPlayer = Object.keys(parsedData)[0];
                    if (firstPlayer) {
                        setSelectedPlayer(firstPlayer);
                    }
                    
                    setUploadStatus(`${Object.keys(parsedData).length}명의 선수 데이터를 성공적으로 로드했습니다.`);
                } catch (error) {
                    console.error('File processing error:', error);
                    setUploadStatus('파일 처리 중 오류가 발생했습니다.');
                } finally {
                    setLoading(false);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                setDragOver(true);
            };

            const handleDragLeave = (e) => {
                e.preventDefault();
                setDragOver(false);
            };

            const handleDrop = async (e) => {
                e.preventDefault();
                setDragOver(false);
                
                const file = e.dataTransfer.files[0];
                if (file) {
                    await handleFile(file);
                }
            };

            const handleResetToDefault = () => {
                if (originalDefaultData) {
                    setPlayersData(originalDefaultData);
                    setDataSource('default');
                    const firstPlayer = Object.keys(originalDefaultData)[0];
                    if (firstPlayer) {
                        setSelectedPlayer(firstPlayer);
                    }
                    setUploadStatus('기본 데이터로 초기화되었습니다.');
                }
            };

            const formatTime = (seconds) => {
                if (!seconds) return '-';
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toFixed(3).padStart(6, '0')}`;
            };

            const formatRecordTime = (timeStr) => {
                if (!timeStr || timeStr === '-' || timeStr === '') return '-';
                
                // 2000M 포인트 제거: "(15)03:53.692" -> "03:53.692"
                const cleanedStr = parseTime2000M(timeStr).trim();
                
                // 시간:분:초.밀리초 형식
                let match = cleanedStr.match(/(\d{1,2}):(\d{2}):(\d{2})\.?(\d*)/);
                if (match) {
                    const hours = parseInt(match[1]) || 0;
                    const minutes = parseInt(match[2]) || 0;
                    const seconds = parseInt(match[3]) || 0;
                    const millisStr = match[4] || '0';
                    const millis = millisStr.substring(0, 3).padEnd(3, '0');
                    
                    // 시간과 분이 0인 경우 생략
                    if (hours === 0 && minutes === 0) {
                        return `${seconds}.${millis}`;
                    } else if (hours === 0) {
                        return `${minutes}:${String(seconds).padStart(2, '0')}.${millis}`;
                    } else {
                        return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${millis}`;
                    }
                }
                
                // 분:초.밀리초 형식
                match = cleanedStr.match(/^(\d{1,2}):(\d{2})\.(\d+)$/);
                if (match) {
                    const minutes = parseInt(match[1]) || 0;
                    const seconds = parseInt(match[2]) || 0;
                    const millisStr = match[3] || '0';
                    const millis = millisStr.substring(0, 3).padEnd(3, '0');
                    
                    if (minutes === 0) {
                        return `${seconds}.${millis}`;
                    }
                    return `${minutes}:${String(seconds).padStart(2, '0')}.${millis}`;
                }
                
                // 초.밀리초 형식
                match = cleanedStr.match(/^(\d{1,2})\.(\d+)$/);
                if (match) {
                    const seconds = parseInt(match[1]) || 0;
                    const millisStr = match[2] || '0';
                    const millis = millisStr.substring(0, 3).padEnd(3, '0');
                    return `${seconds}.${millis}`;
                }
                
                return timeStr;
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '-';
                if (dateStr.length === 8) {
                    return `${dateStr.substring(0, 4)}.${dateStr.substring(4, 6)}.${dateStr.substring(6, 8)}`;
                }
                return dateStr;
            };

            // 라운드 진행 순서 정의 (문자열 시작 기준)
            const getRoundOrder = (roundStr) => {
                if (!roundStr) return -1;
                
                roundStr = String(roundStr).trim();
                
                // 시작 문자열 기준으로 판단
                if (roundStr.startsWith('예선')) return 0;
                if (roundStr.startsWith('준준결승')) return 1;
                if (roundStr.startsWith('준결승')) return 2;
                if (roundStr.startsWith('결승B')) return 3;
                if (roundStr.startsWith('결승')) return 4;
                
                return -1;
            };

            // 라운드 정렬 함수
            const compareRounds = (a, b) => {

                    '2013': 'bg-green-100 text-green-800 border-green-300',     // 중3
                    '2014': 'bg-blue-100 text-blue-800 border-blue-300',        // 중2

                    '2017': 'bg-pink-100 text-pink-800 border-pink-300',        // 초5

                    '2024': 'bg-rose-100 text-rose-800 border-rose-300'        // 미취학

                return colorMap[String(birthYear)] || 'bg-gray-100 text-gray-800 border-gray-300';
            };

                const average = times.reduce((acc, t) => acc + t.time, 0) / times.length;

                                                                <th className="p-2 mobile-text-xs">종목</th>
                                                                <th className="p-2 mobile-text-xs">라운드</th>
                                                                <th className="p-2 mobile-text-xs text-right">기록</th>
                                                                <th className="p-2 mobile-text-xs">순위</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {(() => {
                                                                // 모든 기록을 그룹화: (대회명, 일자, 종목) 기준
                                                                const groupedRecords = {};
                                                                
                                                                currentPlayerData.competitions.forEach((comp, compIdx) => {
                                                                    comp.records.forEach((record, recordIdx) => {
                                                                        const yearMatch = selectedYear === 'ALL' || 
                                                                            record['일자'].substring(0, 4) === selectedYear;
                                                                        const eventMatch = selectedEvent === 'ALL' || 
                                                                            String(record['세부종목']).toUpperCase() === selectedEvent;
                                                                        
                                                                        if (!yearMatch || !eventMatch) return;
                                                                        
                                                                        // 그룹 키: 대회명 + 일자 + 종목
                                                                        const groupKey = `${comp.name}||${record['일자']}||${record['세부종목']}`;
                                                                        if (!groupedRecords[groupKey]) {
                                                                            groupedRecords[groupKey] = {
                                                                                compName: comp.name,
                                                                                date: record['일자'],
                                                                                event: record['세부종목'],
                                                                                records: []
                                                                            };
                                                                        }
                                                                        groupedRecords[groupKey].records.push({
                                                                            ...record,
                                                                            compIdx,
                                                                            recordIdx
                                                                        });
                                                                    });
                                                                });

                                                                // 각 그룹의 기록들을 라운드 순서대로 정렬
                                                                Object.keys(groupedRecords).forEach(key => {
                                                                    groupedRecords[key].records.sort((a, b) => {
                                                                        return compareRounds(a['라운드'], b['라운드']);
                                                                    });
                                                                });

                                                                // 그룹을 일자(최신순), 종목, 라운드 순서로 정렬
                                                                const sortedGroupKeys = Object.keys(groupedRecords).sort((keyA, keyB) => {
                                                                    const groupA = groupedRecords[keyA];
                                                                    const groupB = groupedRecords[keyB];
                                                                    
                                                                    // 1. 일자 정렬 (최신순)
                                                                    if (groupA.date !== groupB.date) {
                                                                        return parseInt(groupB.date) - parseInt(groupA.date);
                                                                    }
                                                                    // 2. 종목 정렬 (500M, 1000M, 1500M, 2000M 순)
                                                                    const eventCompare = compareEvents(groupA.event, groupB.event);
                                                                    if (eventCompare !== 0) {
                                                                        return eventCompare;
                                                                    }
                                                                    // 3. 대회명 정렬 (사전순)
                                                                    return groupA.compName.localeCompare(groupB.compName);
                                                                });

                                                                // 렌더링
                                                                return sortedGroupKeys.map((groupKey, idx) => {
                                                                    const group = groupedRecords[groupKey];
                                                                    let recordsToShow = group.records;
                                                                    
                                                                    // 전체표시가 아닌 경우, 가장 진행된 라운드만 표시
                                                                    if (!showAllRounds && group.records.length > 0) {
                                                                        const bestRound = group.records[group.records.length - 1];
                                                                        recordsToShow = [bestRound];
                                                                    }
                                                                    
                                                                    return recordsToShow.map((record, ridx) => (
                                                                        <tr key={`${groupKey}-${ridx}`} className="border-b hover:bg-gray-50">
                                                                            {ridx === 0 && (
                                                                                <>
                                                                                    <td className="p-2 mobile-text-xs" rowSpan={recordsToShow.length}>{group.compName}</td>
                                                                                    <td className="p-2 mobile-text-xs" rowSpan={recordsToShow.length}>{formatDate(group.date)}</td>
                                                                                    <td className="p-2 mobile-text-xs font-semibold" rowSpan={recordsToShow.length}>{group.event}</td>
                                                                                </>
                                                                            )}
                                                                            <td className="p-2 mobile-text-xs">{record['라운드']}</td>
                                                                            <td className="p-2 mobile-text-xs font-mono text-right">{formatRecordTime(record['기록'])}</td>
                                                                            <td className="p-2 mobile-text-xs">
                                                                                {record['순위'] === 1 && '🥇'}
                                                                                {record['순위'] === 2 && '🥈'}
                                                                                {record['순위'] === 3 && '🥉'}
                                                                                {record['순위'] && ` ${record['순위']}위`}
                                                                            </td>
                                                                        </tr>
                                                                    ));
                                                                });
                                                            })()}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </>
                                    )}
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
